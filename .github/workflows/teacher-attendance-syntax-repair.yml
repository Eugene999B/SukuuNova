name: Teacher attendance syntax repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix exact malformed Prisma filter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/teacher/attendance/page.tsx')
          s = p.read_text()
          old = 'subjectAssignments: { some: { teacherId: session.userId } }] }'
          new = 'subjectAssignments: { some: { teacherId: session.userId } } }] }'
          if old not in s:
              raise SystemExit('Expected malformed teacher attendance filter was not found.')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          npx --yes prettier --check src/app/teacher/attendance/page.tsx || true
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/teacher/attendance/page.tsx .github/workflows/teacher-attendance-syntax-repair.yml
          git rm .github/workflows/teacher-attendance-syntax-repair.yml
          git commit -m 'fix: close teacher attendance prisma filter'
          git push origin HEAD:main
