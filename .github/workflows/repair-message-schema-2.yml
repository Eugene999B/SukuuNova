name: Repair message Prisma schema 2

on:
  push:
    branches: [main]
    paths:
      - ".github/repair-message-schema-2"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align Message model with migration
        shell: python
        run: |
          import re
          from pathlib import Path

          p = Path("prisma/schema.prisma")
          text = p.read_text()
          match = re.search(r'model Message \{(?P<body>.*?)\n\}\n\nmodel TimetableSlot \{', text, re.S)
          if not match:
              raise SystemExit("Message model block not found; refusing to modify schema")
          body = match.group("body")
          if re.search(r'^\\s*idempotencyKey\\s+String\\??\\s*$', body, re.M):
              print("Message idempotency field already present")
              raise SystemExit(0)
          if '  lastError String?\n  createdAt DateTime @default(now())' not in body:
              raise SystemExit("Expected Message fields not found; refusing to modify schema")
          body = body.replace('  lastError String?\n  createdAt DateTime @default(now())', '  lastError String?\n  idempotencyKey String\n  createdAt DateTime @default(now())', 1)
          body = body.replace('  @@unique([id, schoolId])\n  @@index([schoolId])', '  @@unique([id, schoolId])\n  @@unique([schoolId, idempotencyKey])\n  @@index([schoolId])', 1)
          text = text[:match.start("body")] + body + text[match.end("body"):]
          p.write_text(text)
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prisma/schema.prisma
          git commit -m 'fix(schema): align message model with idempotency migration'
          git push
