name: Repair platform search scope
on:
  push:
    branches: [main]
    paths:
      - "src/lib/phase4-service.ts"
      - "src/app/platform/search/page.tsx"
      - ".github/workflows/repair-platform-search-scope.yml"
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scoped search and shared shell
        shell: python
        run: |
          from pathlib import Path
          service = Path('src/lib/phase4-service.ts')
          s = service.read_text()
          old = 'export async function searchCrossSchool(adminId:string,adminRole:string,q:string){requirePlatformPermission(adminRole,"analytics:cross_school");const query=text(q,"q",120).toLowerCase();const dirs=await db.schoolLoginDirectory.findMany({where:{status:"active"},orderBy:{createdAt:"desc"}});'
          new = '''export async function searchCrossSchool(adminId:string,adminRole:string,q:string){requirePlatformPermission(adminRole,"analytics:cross_school");const query=text(q,"q",120).toLowerCase();const dirs=adminRole==="super_admin"?await db.schoolLoginDirectory.findMany({where:{status:"active"},orderBy:{createdAt:"desc"}}):await db.$queryRaw<Array<{schoolId:string;uniqueCode:string}>>(\`SELECT d."schoolId",d."uniqueCode" FROM "SchoolLoginDirectory" d INNER JOIN "PlatformAdminSchoolAccess" a ON a."schoolId"=d."schoolId" WHERE d."status"='active' AND a."adminId"=$1 ORDER BY d."createdAt" DESC\`,adminId);'''
          if old not in s:
              raise SystemExit('Expected search function prefix not found')
          service.write_text(s.replace(old,new,1))
          search_page=Path('src/app/platform/search/page.tsx')
          search_page.write_text('''import PlatformSearchWorkspace from "@/components/PlatformSearchWorkspace";\nexport default function SearchPage(){return <PlatformSearchWorkspace/>;}\n''')
      - name: Remove repair workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/repair-platform-search-scope.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/phase4-service.ts src/app/platform/search/page.tsx .github/workflows/repair-platform-search-scope.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(platform): enforce scoped global search and shared shell"
          git push
