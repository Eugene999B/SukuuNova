name: Typecheck diagnostics

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      SCHOOL_AUTH_SECRET: 01234567890123456789012345678901
      GUARDIAN_AUTH_SECRET: 01234567890123456789012345678901
      QR_AUTH_SECRET: 01234567890123456789012345678901
      PLATFORM_AUTH_SECRET: 01234567890123456789012345678901
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - name: Capture compiler diagnostics
        run: |
          set +e
          npx tsc --noEmit --pretty false > typecheck-diagnostics.txt 2>&1
          status=$?
          echo "tsc_exit_code=$status" >> typecheck-diagnostics.txt
          exit 0
      - name: Commit diagnostics to branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typecheck-diagnostics.txt
          git commit -m "chore: capture temporary typecheck diagnostics [skip ci]" || exit 0
          git push origin HEAD:${{ github.head_ref }}
