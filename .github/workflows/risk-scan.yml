name: SukuuNova risk scan
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sukuunova-risk-scan
  cancel-in-progress: false
jobs:
  risk-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Trigger authenticated risk scan
        env:
          APP_URL: https://sukuunova-production.up.railway.app
        run: |
          node --input-type=module <<'NODE'
          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set("audience", "sukuunova:risk-scan");
          const issued = await fetch(tokenUrl, { headers: { authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` }, signal: AbortSignal.timeout(30000) });
          if (!issued.ok) throw new Error("GitHub could not issue the workflow identity.");
          const { value } = await issued.json();
          if (!value) throw new Error("GitHub returned no workflow identity.");
          const response = await fetch(process.env.APP_URL + "/api/cron/risk-scan", {
            method: "POST", headers: { authorization: `Bearer ${value}` }, signal: AbortSignal.timeout(240000)
          });
          if (!response.ok) throw new Error(`Risk scan failed: HTTP ${response.status}`);
          const result = await response.json();
          if (result.ok !== true) throw new Error("Risk scan did not confirm completion.");
          console.log(`Risk scan completed for ${result.results?.length ?? 0} schools.`);
          NODE
