name: SukuuNova risk scan
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Build verification"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: sukuunova-risk-scan
  cancel-in-progress: false
jobs:
  risk-scan:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Wait for the verified deployment
        if: github.event_name == 'workflow_run'
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
          APP_URL: https://sukuunova-production.up.railway.app
        run: |
          node --input-type=module <<'NODE'
          let ready = false;
          for (let attempt = 0; attempt < 60; attempt++) {
            try {
              const response = await fetch(process.env.APP_URL + "/api/health", { signal: AbortSignal.timeout(10000) });
              if (response.ok && (await response.json()).commit === process.env.EXPECTED_COMMIT) { ready = true; break; }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 20000));
          }
          if (!ready) throw new Error("The verified commit did not become healthy on Railway.");
          console.log("Verified commit is serving traffic on Railway.");
          NODE
      - name: Trigger authenticated risk scan
        env:
          APP_URL: https://sukuunova-production.up.railway.app
        run: |
          node --input-type=module <<'NODE'
          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set("audience", "sukuunova:risk-scan");
          const issued = await fetch(tokenUrl, { headers: { authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` }, signal: AbortSignal.timeout(30000) });
          if (!issued.ok) throw new Error("GitHub could not issue the workflow identity.");
          const { value } = await issued.json();
          if (!value) throw new Error("GitHub returned no workflow identity.");
          const response = await fetch(process.env.APP_URL + "/api/cron/risk-scan", {
            method: "POST", headers: { authorization: `Bearer ${value}` }, signal: AbortSignal.timeout(240000)
          });
          if (!response.ok) throw new Error(`Risk scan failed: HTTP ${response.status}`);
          const result = await response.json();
          if (result.ok !== true) throw new Error("Risk scan did not confirm completion.");
          console.log(`Risk scan completed for ${result.results?.length ?? 0} schools.`);
          NODE
