name: repair-typecheck-contracts
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch verified TypeScript contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, fn):
              p=Path(path); s=p.read_text(); out=fn(s)
              if out == s:
                  raise SystemExit(f'No change made to {path}; expected pattern may already be fixed or has drifted')
              p.write_text(out)

          patch('src/app/school/report-cards/[id]/print/page.tsx', lambda s: (
              s.replace(
                  'type GradeBand = { grade?: string; min?: number; max?: number; remark?: string; label?: string };',
                  'import type { AssessmentRules, GradeBand } from "@/lib/assessment-engine";\n\ntype ReportSettings = { showOverallPosition:boolean; positionScope:"class"|"year_group"; remarkSource:"grade_band"|"position_band"; positionBandLabels:unknown; behaviorRatingFields:unknown; promotionRule:"manual"|"pass_mark"|"overall_position" };'
              ) if 'type GradeBand = { grade?: string; min?: number; max?: number; remark?: string; label?: string };' in s else s
          ).replace(
              'type ReportSettings = { showOverallPosition:boolean; positionScope:"class"|"year_group"; remarkSource:"grade_band"|"position_band"; positionBandLabels:unknown; behaviorRatingFields:unknown; promotionRule:"manual"|"pass_mark"|"overall_position" };\nimport type { AssessmentRules, GradeBand } from "@/lib/assessment-engine";',
              'type ReportSettings = { showOverallPosition:boolean; positionScope:"class"|"year_group"; remarkSource:"grade_band"|"position_band"; positionBandLabels:unknown; behaviorRatingFields:unknown; promotionRule:"manual"|"pass_mark"|"overall_position" };\nimport type { AssessmentRules, GradeBand } from "@/lib/assessment-engine";'
          ).replace(
              'grade:typeof item.grade==="string"?item.grade:typeof item.label==="string"?item.label:undefined,',
              'grade:typeof item.grade==="string"?item.grade:typeof item.label==="string"?item.label:"",'
          ).replace(
              'const rulesFor=(settings:',
              'const rulesFor=(settings:'
          ).replace(
              'return{categories:normalized,rounding,missingScorePolicy,allowTeacherOverride:configured.allowTeacherOverride===true,gradingScale:gradeScale(settings.gradingScale)} as const;',
              'return{categories:normalized,rounding,missingScorePolicy,allowTeacherOverride:configured.allowTeacherOverride===true,gradingScale:gradeScale(settings.gradingScale)} as AssessmentRules;'
          ).replace(
              'const promotionDecision=reportSettings.promotionRule===',
              'const promotionDecision: "promoted" | "not_promoted" | "decision_required"=reportSettings.promotionRule==='
          )
          ))

          patch('src/app/teacher/attendance/page.tsx', lambda s: s
              .replace(
                  'const type = String(formData.get("type") || "in").trim();',
                  'const rawType = String(formData.get("type") || "in").trim();\n  const type: "in" | "out" = rawType === "out" ? "out" : "in";'
              )
              .replace('method: "teacher_register"', 'method: "manual"')
          )

          patch('src/lib/phase4-service.ts', lambda s: s.replace(
              'db.$queryRaw<Array<{schoolId:string;uniqueCode:string}>>(`SELECT d."schoolId",d."uniqueCode"',
              'db.$queryRawUnsafe<Array<{schoolId:string;uniqueCode:string}>>(`SELECT d."schoolId",d."uniqueCode"'
          ))
          PY

      - name: Commit fixes and remove repair workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/school/report-cards/'[id]'/print/page.tsx src/app/teacher/attendance/page.tsx src/lib/phase4-service.ts .github/workflows/repair-typecheck.yml
          git rm .github/workflows/repair-typecheck.yml
          git commit -m 'fix(ci): repair remaining typecheck contracts'
          git push
