name: Repair current typecheck failures
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-typecheck.yml'
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted fixes
        shell: python
        run: |
          from pathlib import Path
          import re
          
          def edit(path, fn):
              p=Path(path); old=p.read_text(); new=fn(old)
              if new==old: print(f'{path}: no change')
              else: p.write_text(new); print(f'{path}: changed')

          edit('src/components/ui/WorkspaceSkeleton.tsx', lambda s: s.replace('export function WorkspaceSkeleton({ cards = 4, rows = 6 }: { cards?: number; rows?: number }) {','export function WorkspaceSkeleton({ variant, title, cards = 4, rows = 6 }: { variant?: string; title?: string; cards?: number; rows?: number }) {').replace('<main className={styles.shell} aria-label="Loading SukuuNova workspace">','<main className={styles.shell} aria-label={title ? `Loading ${title}` : variant ? `Loading ${variant} workspace` : "Loading SukuuNova workspace"}>'))
          for path in ['src/app/school/attendance/loading.tsx','src/app/school/classes/loading.tsx','src/app/school/fees/loading.tsx']:
              edit(path, lambda s: s.replace('import { WorkspaceSkeleton } from "@/components/ui/Skeleton";','import { WorkspaceSkeleton } from "@/components/ui/WorkspaceSkeleton";'))
          edit('src/app/api/school/announcements/route.ts', lambda s: s.replace('      const now = new Date();\n      if (recipients.length) {','      const now = new Date();\n      const announcementId = `announcement-${now.getTime()}-${session.userId.slice(0, 8)}`;\n      if (recipients.length) {').replace('            attempts: 1,\n            nextAttemptAt: now,','            attempts: 1,\n            idempotencyKey: `announcement:${session.schoolId}:${announcementId}:${recipient.id}:in_app`,\n            nextAttemptAt: now,').replace('      const announcementId = `announcement-${now.getTime()}-${session.userId.slice(0, 8)}`;\n      await appendSchoolAudit','      await appendSchoolAudit'))
          edit('src/app/api/school/communications/route.ts', lambda s: s.replace('nextAttemptAt: new Date() })) });','nextAttemptAt: new Date(), idempotencyKey: `${batchKey}:${r.id}:in_app` })) });'))
          edit('src/lib/message-outbox.ts', lambda s: s.replace('type NotificationTemplateKey=','export type NotificationTemplateKey='))
          edit('src/app/school/people/people-cache.ts', lambda s: s.replace('orderBy: { createdAt: "desc" }','orderBy: { id: "desc" }'))
          edit('src/lib/platform-admin-service.ts', lambda s: s.replace('orderBy: { createdAt: "desc" }','orderBy: { id: "desc" }'))
          edit('src/app/school/communications/alerts/page.tsx', lambda s: s.replace('value={alert.recipientPhone}','value={alert.recipientPhone ?? ""}'))
          edit('src/lib/attendance-service.ts', lambda s: s.replace('for (const link of student.guardians) {\n      await enqueueSms(tx, {','for (const link of student.guardians) {\n      if (!link.guardian.phone) continue;\n      await enqueueSms(tx, {'))
          edit('src/lib/finance-service.ts', lambda s: s.replace('for (const link of student.guardians) {\n    await enqueueSms(tx, {','for (const link of student.guardians) {\n    if (!link.guardian.phone) continue;\n    await enqueueSms(tx, {'))
          edit('tests/message-outbox.test.ts', lambda s: re.sub(r'(recipientPhone:\s*[^,\n}]+,\n\s*body:[^\n]+,\n)(\s*status:\s*"queued",)',r'\1      idempotencyKey: `test:${crypto.randomUUID()}`,\n\2',s))
      - name: Validate repaired tree
        run: |
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          npx prisma generate
          npx tsc --noEmit --pretty false
      - name: Commit and remove repair workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/repair-typecheck.yml
          git add .
          git commit -m 'fix: resolve current typecheck failures'
          git push
