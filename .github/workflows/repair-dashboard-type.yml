name: Repair dashboard type regression

on:
  push:
    branches: [main]
    paths:
      - "src/app/dashboard/page.tsx"
      - ".github/workflows/repair-dashboard-type.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed announcement type
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/dashboard/page.tsx')
          s = p.read_text()
          old = 'type AnnouncementPreview = { id: string; body: string; createdAt: Date }[];'
          new = 'type AnnouncementPreview = { id: string; body: string; createdAt: Date };'
          if old not in s:
              raise SystemExit('Expected dashboard type declaration not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/repair-dashboard-type.yml
          if git diff --quiet -- src/app/dashboard/page.tsx .github/workflows/repair-dashboard-type.yml; then
            echo "No repair needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/dashboard/page.tsx .github/workflows/repair-dashboard-type.yml
          git commit -m "fix(dashboard): correct announcement preview type"
          git push
