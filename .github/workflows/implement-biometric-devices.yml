name: Implement biometric device attendance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-biometric-devices.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded hardware attendance implementation
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          def read(p): return (root / p).read_text()
          def write(p, s):
              path = root / p; path.parent.mkdir(parents=True, exist_ok=True); path.write_text(s)
          def replace_once(p, old, new):
              s = read(p); n = s.count(old)
              if n != 1: raise SystemExit(f'{p}: expected one occurrence, found {n}: {old[:100]!r}')
              write(p, s.replace(old, new, 1))

          p='prisma/schema.prisma'
          replace_once(p,'  reportCardTemplates ReportCardTemplate[]\n  houses              House[]\n}', '  reportCardTemplates ReportCardTemplate[]\n  houses              House[]\n  devices             Device[]\n  fingerprintEnrollments FingerprintEnrollment[]\n  deviceAttendanceReceipts DeviceAttendanceReceipt[]\n}')
          replace_once(p,'  faceReviewsCompleted FaceMatchReview[] @relation("FaceReviewedBy")\n','  faceReviewsCompleted FaceMatchReview[] @relation("FaceReviewedBy")\n  fingerprintEnrollments FingerprintEnrollment[] @relation("FingerprintStaff")\n')
          replace_once(p,'  faceEnrollments  FaceEnrollment[]\n','  faceEnrollments  FaceEnrollment[]\n  fingerprintEnrollments FingerprintEnrollment[] @relation("FingerprintStudent")\n')
          replace_once(p,'  recordedBy       String\n','  recordedBy       String?\n')
          replace_once(p,'  recorder         User     @relation("AttendanceRecorder", fields: [recordedBy, schoolId], references: [id, schoolId], onDelete: Restrict)\n','  recorder         User?    @relation("AttendanceRecorder", fields: [recordedBy, schoolId], references: [id, schoolId], onDelete: Restrict)\n  device           Device?  @relation(fields: [deviceId, schoolId], references: [id, schoolId], onDelete: Restrict)\n')
          marker='\nmodel ApprovedPickup {'
          s=read(p)
          if s.count(marker)!=1: raise SystemExit('schema insertion anchor mismatch')
          models='''\nmodel Device {\n  id           String   @id @default(cuid())\n  schoolId     String\n  deviceSerial String\n  kind         String\n  label        String\n  apiKeyHash   String\n  status       String   @default("active")\n  lastSeenAt   DateTime?\n  createdAt    DateTime @default(now())\n  school       School   @relation(fields: [schoolId], references: [id], onDelete: Restrict)\n  attendanceEvents AttendanceEvent[]\n  attendanceReceipts DeviceAttendanceReceipt[]\n  @@unique([id, schoolId])\n  @@unique([schoolId, deviceSerial])\n  @@index([schoolId])\n}\n\nmodel FingerprintEnrollment {\n  id         String   @id @default(cuid())\n  schoolId   String\n  externalId String\n  studentId  String?\n  staffId    String?\n  createdAt  DateTime @default(now())\n  school     School   @relation(fields: [schoolId], references: [id], onDelete: Restrict)\n  student    Student? @relation("FingerprintStudent", fields: [studentId, schoolId], references: [id, schoolId], onDelete: Restrict)\n  staff      User?    @relation("FingerprintStaff", fields: [staffId, schoolId], references: [id, schoolId], onDelete: Restrict)\n  @@unique([id, schoolId])\n  @@unique([schoolId, externalId])\n  @@unique([schoolId, studentId])\n  @@unique([schoolId, staffId])\n  @@index([schoolId])\n}\n\nmodel DeviceAttendanceReceipt {\n  id             String   @id @default(cuid())\n  schoolId       String\n  deviceId       String\n  idempotencyKey String\n  nonce          String\n  capturedAt     DateTime?\n  createdAt      DateTime @default(now())\n  processedAt    DateTime?\n  school         School   @relation(fields: [schoolId], references: [id], onDelete: Restrict)\n  device         Device   @relation(fields: [deviceId, schoolId], references: [id, schoolId], onDelete: Cascade)\n  @@unique([id, schoolId])\n  @@unique([schoolId, deviceId, idempotencyKey])\n  @@unique([schoolId, deviceId, nonce])\n  @@index([schoolId])\n  @@index([schoolId, deviceId, createdAt])\n}\n'''
          write(p,s.replace(marker,models+marker,1))

          p='src/lib/db.ts'
          replace_once(p,'  "ReportCardTemplate"\n]);','  "ReportCardTemplate",\n  "Device",\n  "FingerprintEnrollment",\n  "DeviceAttendanceReceipt"\n]);')

          p='src/lib/default-rbac.ts'
          s=read(p)
          if '"devices:manage"' not in s:
              s=s.replace('"exports:gradebook"\n] as const;','"exports:gradebook","devices:manage"\n] as const;')
              s=s.replace('"exports:gradebook",\n  "lesson_plans:review"','"exports:gradebook","devices:manage",\n  "lesson_plans:review"')
              s=s.replace('"academic_readiness:view","guardian_alerts:view","guardian_alerts:manage"\n];','"academic_readiness:view","guardian_alerts:view","guardian_alerts:manage","devices:manage"\n];')
          write(p,s)

          write('src/lib/device-auth.ts','''import { createHash, createHmac, randomBytes, timingSafeEqual } from "node:crypto";\nimport { AppError } from "./errors";\n\nexport function generateDeviceSecret(): string { return randomBytes(32).toString("base64url"); }\nexport function hashDeviceSecret(secret: string): string { return createHash("sha256").update(secret, "utf8").digest("hex"); }\nexport function deviceSignature(keyHash: string, timestamp: string, nonce: string, rawBody: string): string {\n  return createHmac("sha256", keyHash).update(timestamp + "\\n" + nonce + "\\n" + rawBody, "utf8").digest("hex");\n}\nexport function verifyDeviceSignature(input: { keyHash:string; timestamp:string; nonce:string; rawBody:string; signature:string; now?:Date; maxSkewMs?:number }): void {\n  const now=input.now??new Date(); const ts=Number(input.timestamp);\n  if(!Number.isInteger(ts)) throw new AppError("Invalid device timestamp.",401,"INVALID_DEVICE_SIGNATURE");\n  const max=input.maxSkewMs??300000;\n  if(Math.abs(now.getTime()-ts)>max) throw new AppError("Device request timestamp is outside the allowed replay window.",401,"DEVICE_TIMESTAMP_EXPIRED");\n  if(!/^[0-9a-f]{64}$/i.test(input.signature)) throw new AppError("Invalid device signature.",401,"INVALID_DEVICE_SIGNATURE");\n  const expected=Buffer.from(deviceSignature(input.keyHash,input.timestamp,input.nonce,input.rawBody),"hex");\n  const received=Buffer.from(input.signature,"hex");\n  if(expected.length!==received.length || !timingSafeEqual(expected,received)) throw new AppError("Invalid device signature.",401,"INVALID_DEVICE_SIGNATURE");\n}\n''')

          write('src/lib/fingerprint-service.ts','''import type { TenantDb } from "./db";\nimport { AppError } from "./errors";\nimport { recordAttendance } from "./attendance-service";\nexport async function matchFingerprintAttendance(tx: TenantDb, input: { schoolId:string; deviceId:string; externalId:string; confidence?:number; type:"in"|"out" }) {\n  const externalId=input.externalId.trim(); if(!externalId) throw new AppError("Fingerprint externalId is required.",400,"INVALID_INPUT");\n  const enrollment=await tx.fingerprintEnrollment.findFirst({where:{externalId},select:{studentId:true,staffId:true}});\n  let target:{studentId:string}|{staffId:string}|null=null;\n  if(enrollment?.studentId) target={studentId:enrollment.studentId}; else if(enrollment?.staffId) target={staffId:enrollment.staffId};\n  else if(externalId.startsWith("student:")) target={studentId:externalId.slice(8)}; else if(externalId.startsWith("staff:")) target={staffId:externalId.slice(6)};\n  if(!target) throw new AppError("Fingerprint identity is not enrolled for this school.",404,"FINGERPRINT_IDENTITY_NOT_FOUND");\n  if(input.confidence!==undefined && (!Number.isFinite(input.confidence)||input.confidence<0||input.confidence>100)) throw new AppError("Fingerprint confidence must be between 0 and 100.",400,"INVALID_INPUT");\n  const event=await recordAttendance(tx,{schoolId:input.schoolId,target,type:input.type,method:"fingerprint",confidenceScore:input.confidence,deviceId:input.deviceId,deviceAuthenticated:true});\n  return {status:"recorded" as const,event};\n}\n''')

          p='src/lib/attendance-service.ts'; s=read(p)
          s=s.replace('method: "manual" | "qr" | "face"; confidenceScore?: number; deviceId?: string; timestamp?: Date;','method: "manual" | "qr" | "face" | "fingerprint" | "card"; confidenceScore?: number; deviceId?: string; timestamp?: Date; deviceAuthenticated?: boolean;')
          old='  await requirePermission(tx, input.actorId, "attendance:record");\n  if (input.target.studentId) await authorizeStudentAttendance(tx, input.actorId, input.target.studentId);\n  else await authorizeStaffAttendance(tx, input.actorId);\n'
          new='  if (input.deviceAuthenticated) { if (!input.deviceId) throw new AppError("Authenticated device id is required.",401,"DEVICE_CONTEXT_REQUIRED"); } else { if (!input.actorId) throw new ForbiddenError("A staff actor is required for manual attendance."); await requirePermission(tx, input.actorId, "attendance:record"); if (input.target.studentId) await authorizeStudentAttendance(tx, input.actorId, input.target.studentId); else await authorizeStaffAttendance(tx, input.actorId); }\n'
          if old not in s: raise SystemExit('attendance auth block not found')
          s=s.replace(old,new,1).replace('recordedBy: input.actorId','recordedBy: input.actorId ?? null',1)
          s=s.replace('schoolId: input.schoolId, actorId: input.actorId, action: "attendance.recorded",','schoolId: input.schoolId, actorId: input.actorId ?? ("device:" + input.deviceId), action: "attendance.recorded",',1)
          anchor='  if (input.target.staffId && isLate) {'
          notify='''  if (input.target.studentId) {\n    const student = await tx.student.findUnique({ where: { id: input.target.studentId }, select: { name: true } });\n    const guardians = await tx.studentGuardian.findMany({ where: { studentId: input.target.studentId, isPrimary: true }, include: { guardian: { select: { id: true, phone: true } } } });\n    const attendanceLabel = input.type === "out" ? "checked out" : (isLate ? "checked in late" : "checked in on time");\n    for (const link of guardians) { await enqueueSms(tx, { schoolId: input.schoolId, recipientType: "guardian", recipientId: link.guardian.id, recipientPhone: link.guardian.phone, body: "SukuuNova attendance alert: " + (student?.name ?? "Your child") + " " + attendanceLabel + ".", templateKey: "student_absence", templateVariables: { "1": student?.name ?? "Student", "2": attendanceLabel } }); }\n  }\n\n'''
          if s.count(anchor)!=1: raise SystemExit('student notification anchor not found')
          s=s.replace(anchor,notify+anchor,1); write(p,s)

          p='src/lib/face-service.ts'; s=read(p)
          s=s.replace('    actorId: string;\n    image: string;\n    deviceId?: string;\n    type: "in" | "out";\n    timestamp?: Date;\n','    actorId?: string;\n    image: string;\n    deviceId?: string;\n    type: "in" | "out";\n    deviceAuthenticated?: boolean;\n',1)
          s=s.replace('  await requirePermission(tx, input.actorId, "attendance:record");\n  const [settings, match] = await Promise.all([','  if (!input.deviceAuthenticated) { if (!input.actorId) throw new AppError("A staff actor is required for face attendance.",401,"ACTOR_REQUIRED"); await requirePermission(tx, input.actorId, "attendance:record"); } else if (!input.deviceId) throw new AppError("Authenticated device id is required.",401,"DEVICE_CONTEXT_REQUIRED");\n  const [settings, match] = await Promise.all([',1)
          s=s.replace('    method: "face",\n    timestamp: input.timestamp,\n','    method: "face",\n',1); write(p,s)

          p='src/app/api/phase2/face/route.ts'; s=read(p); s=re.sub(r',timestamp:z\\.coerce\\.date\\(\\)\\.optional\\(\\)','',s,count=1); write(p,s)

          write('src/app/api/devices/attendance/route.ts','''import { NextResponse } from "next/server";\nimport { z } from "zod";\nimport { db, withTenant } from "@/lib/db";\nimport { routeError } from "@/lib/errors";\nimport { verifyDeviceSignature } from "@/lib/device-auth";\nimport { matchFaceAttendance } from "@/lib/face-service";\nimport { matchFingerprintAttendance } from "@/lib/fingerprint-service";\nconst schema=z.object({schoolCode:z.string().trim().min(2).max(80),deviceSerial:z.string().trim().min(2).max(120),kind:z.enum(["face","fingerprint","card"]),idempotencyKey:z.string().trim().min(8).max(200),capturedAt:z.string().datetime().optional(),type:z.enum(["in","out"]),image:z.string().min(100).optional(),externalId:z.string().trim().max(200).optional(),confidence:z.number().min(0).max(100).optional()});\nexport async function POST(request:Request){try{const rawBody=await request.text();const input=schema.parse(JSON.parse(rawBody));const timestamp=request.headers.get("x-device-timestamp")??"";const nonce=request.headers.get("x-device-nonce")??"";const signature=request.headers.get("x-device-signature")??"";if(!timestamp||!nonce||!signature)throw new Error("Missing device authentication headers.");const directory=await db.schoolLoginDirectory.findUnique({where:{uniqueCode:input.schoolCode.toLowerCase()},select:{schoolId:true,status:true}});if(!directory||directory.status!=="active")return NextResponse.json({ok:false},{status:401});const result=await withTenant(directory.schoolId,async tx=>{const device=await tx.device.findFirst({where:{deviceSerial:input.deviceSerial,status:"active"},select:{id:true,apiKeyHash:true,kind:true}});if(!device||device.kind!==input.kind)throw new Error("Device is not active or kind does not match.");verifyDeviceSignature({keyHash:device.apiKeyHash,timestamp,nonce,rawBody,signature});let receipt;try{receipt=await tx.deviceAttendanceReceipt.create({data:{schoolId:directory.schoolId,deviceId:device.id,idempotencyKey:input.idempotencyKey,nonce,capturedAt:input.capturedAt?new Date(input.capturedAt):null}});}catch(error){if((error as {code?:string}).code==="P2002")return{status:"duplicate" as const};throw error;}const now=new Date();if(input.capturedAt){const deviationMs=Math.abs(now.getTime()-new Date(input.capturedAt).getTime());if(deviationMs>10000)console.warn("Device attendance capture time differs from server time; server time is authoritative",{deviceId:device.id,receiptId:receipt.id,deviationMs});}await tx.device.update({where:{id:device.id},data:{lastSeenAt:now}});let result;if(input.kind==="face"){if(!input.image)throw new Error("Face device events require image data.");result=await matchFaceAttendance(tx,{schoolId:directory.schoolId,image:input.image,deviceId:device.id,type:input.type,deviceAuthenticated:true});}else if(input.kind==="fingerprint"){if(!input.externalId)throw new Error("Fingerprint device events require externalId.");result=await matchFingerprintAttendance(tx,{schoolId:directory.schoolId,deviceId:device.id,externalId:input.externalId,confidence:input.confidence,type:input.type});}else throw new Error("Card device attendance is not enabled until a card identity mapping is configured.");await tx.deviceAttendanceReceipt.update({where:{id:receipt.id},data:{processedAt:new Date()}});return{status:"recorded" as const,eventId:result.event.id};});return NextResponse.json({ok:true,result},{status:result.status==="duplicate"?200:201});}catch(error){return routeError(error);}}\n''')

          write('src/app/api/school/devices/route.ts','''import { NextResponse } from "next/server";\nimport { z } from "zod";\nimport { requireSchoolSession } from "@/lib/auth";\nimport { withTenant } from "@/lib/db";\nimport { routeError } from "@/lib/errors";\nimport { requirePermission } from "@/lib/rbac";\nimport { appendSchoolAudit } from "@/lib/audit";\nimport { generateDeviceSecret, hashDeviceSecret } from "@/lib/device-auth";\nconst createSchema=z.object({deviceSerial:z.string().trim().min(2).max(120),kind:z.enum(["face","fingerprint","card"]),label:z.string().trim().min(1).max(120)});const patchSchema=z.object({id:z.string().min(1),action:z.literal("revoke")});\nexport async function GET(){try{const s=await requireSchoolSession();const devices=await withTenant(s.schoolId,async tx=>{await requirePermission(tx,s.userId,"devices:manage");return tx.device.findMany({select:{id:true,deviceSerial:true,kind:true,label:true,status:true,lastSeenAt:true,createdAt:true},orderBy:{createdAt:"desc"}});});return NextResponse.json({devices});}catch(e){return routeError(e);}}\nexport async function POST(r:Request){try{const s=await requireSchoolSession();const i=createSchema.parse(await r.json());const deviceSecret=generateDeviceSecret();const apiKeyHash=hashDeviceSecret(deviceSecret);const device=await withTenant(s.schoolId,async tx=>{await requirePermission(tx,s.userId,"devices:manage");const d=await tx.device.create({data:{schoolId:s.schoolId,deviceSerial:i.deviceSerial,kind:i.kind,label:i.label,apiKeyHash,status:"active"},select:{id:true,deviceSerial:true,kind:true,label:true,status:true,createdAt:true}});await appendSchoolAudit(tx,{schoolId:s.schoolId,actorId:s.userId,action:"device.registered",entityType:"Device",entityId:d.id,after:{deviceSerial:d.deviceSerial,kind:d.kind,label:d.label}});return d;});return NextResponse.json({ok:true,device,deviceSecret,warning:"Copy this secret now. It will never be shown again."},{status:201});}catch(e){return routeError(e);}}\nexport async function PATCH(r:Request){try{const s=await requireSchoolSession();const i=patchSchema.parse(await r.json());const device=await withTenant(s.schoolId,async tx=>{await requirePermission(tx,s.userId,"devices:manage");const existing=await tx.device.findUnique({where:{id:i.id},select:{id:true,status:true,deviceSerial:true,kind:true,label:true}});if(!existing)throw new Error("Device not found.");const updated=await tx.device.update({where:{id:existing.id},data:{status:"revoked"},select:{id:true,status:true,deviceSerial:true,kind:true,label:true}});await appendSchoolAudit(tx,{schoolId:s.schoolId,actorId:s.userId,action:"device.revoked",entityType:"Device",entityId:updated.id,before:existing,after:updated});return updated;});return NextResponse.json({ok:true,device});}catch(e){return routeError(e);}}\n''')

          write('src/app/school/settings/devices/page.tsx','''"use client";\nimport {useEffect,useState} from "react";\nimport {AppShell} from "@/components/AppShell";\ntype Device={id:string;deviceSerial:string;kind:string;label:string;status:string;lastSeenAt:string|null;createdAt:string};\nexport default function DevicesPage(){const[devices,setDevices]=useState<Device[]>([]);const[serial,setSerial]=useState("");const[label,setLabel]=useState("Main Gate");const[kind,setKind]=useState("fingerprint");const[secret,setSecret]=useState("");const[message,setMessage]=useState("");async function load(){const r=await fetch("/api/school/devices");const d=await r.json();if(r.ok)setDevices(d.devices??[]);else setMessage(d.error??"Could not load devices.");}useEffect(()=>{void load();},[]);async function register(){setMessage("");setSecret("");const r=await fetch("/api/school/devices",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({deviceSerial:serial,kind,label})});const d=await r.json();if(!r.ok){setMessage(d.error??"Could not register device.");return;}setSecret(d.deviceSecret);setMessage("Device registered. Copy the secret now; it will not be shown again.");setSerial("");await load();}async function revoke(id:string){if(!window.confirm("Revoke this device? It will stop accepting attendance events immediately."))return;const r=await fetch("/api/school/devices",{method:"PATCH",headers:{"content-type":"application/json"},body:JSON.stringify({id,action:"revoke"})});const d=await r.json();setMessage(r.ok?"Device revoked.":d.error??"Could not revoke device.");if(r.ok)await load();}return <AppShell universe="school" title="Biometric Attendance Devices" subtitle="Register gate devices, issue one-time secrets, and revoke lost or replaced hardware." active="Security & Access"><main style={{display:"grid",gap:18}}><section className="app-card app-panel"><p className="app-kpi-label">DEVICE REGISTRATION</p><h2>Connect a real attendance terminal</h2><div style={{display:"grid",gap:12,maxWidth:720,gridTemplateColumns:"1fr 1fr"}}><input value={serial} onChange={e=>setSerial(e.target.value)} placeholder="Device serial"/><input value={label} onChange={e=>setLabel(e.target.value)} placeholder="Label, e.g. Main Gate"/><select value={kind} onChange={e=>setKind(e.target.value)}><option value="fingerprint">Fingerprint</option><option value="face">Face</option><option value="card">Card</option></select><button className="app-action" onClick={()=>void register()} disabled={!serial.trim()||!label.trim()}><strong>Register device</strong></button></div>{secret?<div className="app-banner" style={{marginTop:14}}><strong>Copy this device secret now</strong><p style={{wordBreak:"break-all"}}>{secret}</p></div>:null}{message?<div className="app-banner" style={{marginTop:14}}><p>{message}</p></div>:null}</section><section className="app-card app-panel"><p className="app-kpi-label">REGISTERED DEVICES</p>{devices.length===0?<p>No attendance devices registered yet.</p>:<div style={{display:"grid",gap:10}}>{devices.map(d=><div key={d.id} style={{display:"grid",gridTemplateColumns:"1.4fr .8fr 1fr auto",gap:12,alignItems:"center",border:"1px solid var(--app-line,#d7e0e0)",padding:12,borderRadius:12}}><div><strong>{d.label}</strong><div>{d.deviceSerial}</div></div><span>{d.kind}</span><span>{d.status}{d.lastSeenAt?` · ${new Date(d.lastSeenAt).toLocaleString()}`:" · never seen"}</span>{d.status==="active"?<button className="app-pill" onClick={()=>void revoke(d.id)}>Revoke</button>:<span className="app-pill">Revoked</span>}</div>)}</div>}</section></main></AppShell>;}\n''')

          write('prisma/migrations/20260831070000_biometric_devices/migration.sql','''CREATE TABLE "Device" ("id" TEXT NOT NULL,"schoolId" TEXT NOT NULL,"deviceSerial" TEXT NOT NULL,"kind" TEXT NOT NULL,"label" TEXT NOT NULL,"apiKeyHash" TEXT NOT NULL,"status" TEXT NOT NULL DEFAULT 'active',"lastSeenAt" TIMESTAMP(3),"createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,CONSTRAINT "Device_pkey" PRIMARY KEY ("id"),CONSTRAINT "Device_schoolId_fkey" FOREIGN KEY ("schoolId") REFERENCES "School"("id") ON DELETE RESTRICT ON UPDATE CASCADE);\nCREATE TABLE "FingerprintEnrollment" ("id" TEXT NOT NULL,"schoolId" TEXT NOT NULL,"externalId" TEXT NOT NULL,"studentId" TEXT,"staffId" TEXT,"createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,CONSTRAINT "FingerprintEnrollment_pkey" PRIMARY KEY ("id"),CONSTRAINT "FingerprintEnrollment_schoolId_fkey" FOREIGN KEY ("schoolId") REFERENCES "School"("id") ON DELETE RESTRICT ON UPDATE CASCADE,CONSTRAINT "FingerprintEnrollment_studentId_schoolId_fkey" FOREIGN KEY ("studentId","schoolId") REFERENCES "Student"("id","schoolId") ON DELETE RESTRICT ON UPDATE CASCADE,CONSTRAINT "FingerprintEnrollment_staffId_schoolId_fkey" FOREIGN KEY ("staffId","schoolId") REFERENCES "User"("id","schoolId") ON DELETE RESTRICT ON UPDATE CASCADE);\nCREATE TABLE "DeviceAttendanceReceipt" ("id" TEXT NOT NULL,"schoolId" TEXT NOT NULL,"deviceId" TEXT NOT NULL,"idempotencyKey" TEXT NOT NULL,"nonce" TEXT NOT NULL,"capturedAt" TIMESTAMP(3),"createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,"processedAt" TIMESTAMP(3),CONSTRAINT "DeviceAttendanceReceipt_pkey" PRIMARY KEY ("id"),CONSTRAINT "DeviceAttendanceReceipt_schoolId_fkey" FOREIGN KEY ("schoolId") REFERENCES "School"("id") ON DELETE RESTRICT ON UPDATE CASCADE,CONSTRAINT "DeviceAttendanceReceipt_deviceId_schoolId_fkey" FOREIGN KEY ("deviceId","schoolId") REFERENCES "Device"("id","schoolId") ON DELETE CASCADE ON UPDATE CASCADE);\nALTER TABLE "AttendanceEvent" ALTER COLUMN "recordedBy" DROP NOT NULL;\nALTER TABLE "AttendanceEvent" ADD CONSTRAINT "AttendanceEvent_deviceId_schoolId_fkey" FOREIGN KEY ("deviceId","schoolId") REFERENCES "Device"("id","schoolId") ON DELETE RESTRICT ON UPDATE CASCADE;\nCREATE UNIQUE INDEX "Device_id_schoolId_key" ON "Device"("id","schoolId");\nCREATE UNIQUE INDEX "Device_schoolId_deviceSerial_key" ON "Device"("schoolId","deviceSerial");\nCREATE INDEX "Device_schoolId_idx" ON "Device"("schoolId");\nCREATE UNIQUE INDEX "FingerprintEnrollment_id_schoolId_key" ON "FingerprintEnrollment"("id","schoolId");\nCREATE UNIQUE INDEX "FingerprintEnrollment_schoolId_externalId_key" ON "FingerprintEnrollment"("schoolId","externalId");\nCREATE UNIQUE INDEX "FingerprintEnrollment_schoolId_studentId_key" ON "FingerprintEnrollment"("schoolId","studentId");\nCREATE UNIQUE INDEX "FingerprintEnrollment_schoolId_staffId_key" ON "FingerprintEnrollment"("schoolId","staffId");\nCREATE INDEX "FingerprintEnrollment_schoolId_idx" ON "FingerprintEnrollment"("schoolId");\nCREATE UNIQUE INDEX "DeviceAttendanceReceipt_id_schoolId_key" ON "DeviceAttendanceReceipt"("id","schoolId");\nCREATE UNIQUE INDEX "DeviceAttendanceReceipt_schoolId_deviceId_idempotencyKey_key" ON "DeviceAttendanceReceipt"("schoolId","deviceId","idempotencyKey");\nCREATE UNIQUE INDEX "DeviceAttendanceReceipt_schoolId_deviceId_nonce_key" ON "DeviceAttendanceReceipt"("schoolId","deviceId","nonce");\nCREATE INDEX "DeviceAttendanceReceipt_schoolId_idx" ON "DeviceAttendanceReceipt"("schoolId");\nCREATE INDEX "DeviceAttendanceReceipt_schoolId_deviceId_createdAt_idx" ON "DeviceAttendanceReceipt"("schoolId","deviceId","createdAt");\nALTER TABLE "Device" ENABLE ROW LEVEL SECURITY;ALTER TABLE "Device" FORCE ROW LEVEL SECURITY;CREATE POLICY "Device_tenant_isolation" ON "Device" USING ("schoolId" = sukuunova_current_school_id()) WITH CHECK ("schoolId" = sukuunova_current_school_id());\nALTER TABLE "FingerprintEnrollment" ENABLE ROW LEVEL SECURITY;ALTER TABLE "FingerprintEnrollment" FORCE ROW LEVEL SECURITY;CREA