          write('docs/biometric-devices.md','''# SukuuNova biometric devices\n\nHMAC-SHA256 signs `timestamp + "\\n" + nonce + "\\n" + raw JSON body`. The server stores only `SHA-256(deviceSecret)` in `Device.apiKeyHash`; the device derives the same value locally and uses it as the HMAC key.\n\nThe signed body carries `schoolCode` so the server can establish the tenant before querying the FORCE-RLS `Device` table. It never bypasses RLS. `DeviceAttendanceReceipt` uses unique `(schoolId, deviceId, idempotencyKey)` and `(schoolId, deviceId, nonce)` constraints, so offline retries and request replays cannot create duplicate attendance events.\n\nDevice capture time is retained for diagnostics only; `recordAttendance()` uses server time for lateness and the persisted attendance timestamp.\n''')
