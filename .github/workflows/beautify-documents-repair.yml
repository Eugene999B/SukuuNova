name: apply-document-beautification
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'chore: remove document beautification repair workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch document and design files
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          from pathlib import Path
          
          # Timetable runtime branding.
          p = Path('src/app/school/timetable/print/PrintStudio.tsx')
          s = p.read_text()
          s = s.replace('import { useMemo, useState } from "react";', 'import { useMemo, useState } from "react";\nimport type { CSSProperties } from "react";\nimport { getSchoolDocumentIdentity } from "@/lib/school-document-identity";')
          s = s.replace('type School={name:string;uniqueCode:string;logoUrl:string|null};', 'type School={name:string;uniqueCode:string;logoUrl:string|null;brandColors:unknown};')
          s = s.replace(' const [audience,setAudience]=useState<Audience>("class");const [selectedId,setSelectedId]=useState(data.classes[0]?.id??"");const [design,setDesign]=useState<Design>("modern");', ' const [audience,setAudience]=useState<Audience>("class");const [selectedId,setSelectedId]=useState(data.classes[0]?.id??"");const [design,setDesign]=useState<Design>("modern");\n const identity=getSchoolDocumentIdentity(data.school??{name:"School",uniqueCode:"",logoUrl:null,brandColors:null});\n const documentStyle={"--school-primary":identity.primary,"--school-accent":identity.accent} as CSSProperties;')
          s = s.replace('return <main className={`print-studio ${design}`}>', 'return <main className={`print-studio ${design}`} style={documentStyle}>')
          s = s.replace('function hashColour(value:string){let h=0;for(let i=0;i<value.length;i++)h=(h*31+value.charCodeAt(i))>>>0;const palette=["#2563eb","#7c3aed","#059669","#ea580c","#db2777","#0891b2","#ca8a04","#4f46e5"];return palette[h%palette.length];}', 'function hashColour(value:string){let h=0;for(let i=0;i<value.length;i++)h=(h*31+value.charCodeAt(i))>>>0;const palette=["var(--school-primary)","#7c5cff","#1f8f78","#c7771b","#b54d75","#3577a8"];return palette[h%palette.length];}')
          p.write_text(s)
          
          # Payroll workspace: expose each payslip through the HTML/CSS studio.
          p = Path('src/components/PayrollWorkspace.tsx')
          s = p.read_text()
          old = '</section><section className="finance-panel"><div className="finance-head"><div><span className="finance-kicker">RUN HISTORY</span><h2>Payroll runs</h2></div></div>'
          new = '</section><section className="finance-panel"><div className="finance-head"><div><span className="finance-kicker">PAYSLIPS</span><h2>Issued payslips</h2><p>Open a school-branded, print-ready copy for any payslip you are authorised to view.</p></div></div><div className="finance-payroll-list">{data.payslips.map(p=><article key={p.id}><div><b>{p.payrollRun?.period??"Payroll"}</b><span>{money(p.net)}</span></div><a className="app-action" href={`/school/fees/payroll/payslips/${p.id}/print`}>Print / Save PDF</a></article>)}{!data.payslips.length&&<div className="finance-empty">No payslips have been issued yet.</div>}</div></section><section className="finance-panel"><div className="finance-head"><div><span className="finance-kicker">RUN HISTORY</span><h2>Payroll runs</h2></div></div>'
          if old not in s:
            raise SystemExit('Payroll insertion anchor not found')
          p.write_text(s.replace(old,new,1))
          
          # Make the old report-card component consume the common identity helper without changing its output contract.
          p = Path('src/components/ReportCardPrintStudio.tsx')
          s = p.read_text()
          s = s.replace('import { useMemo, useState } from "react";', 'import { useMemo, useState } from "react";\nimport { getSchoolDocumentIdentity } from "@/lib/school-document-identity";')
          s = s.replace('  const brand = data.school.brandColors && typeof data.school.brandColors === "object" && !Array.isArray(data.school.brandColors)\n    ? data.school.brandColors as Record<string, unknown>\n    : {};\n  const primary = color(brand.primary, "#164e63");\n  const accent = color(brand.accent, "#dcefeb");', '  const identity = getSchoolDocumentIdentity(data.school);\n  const primary = identity.primary;\n  const accent = identity.accent;')
          p.write_text(s)
          
          # Central typography tokens.
          Path('src/app/typography.css').write_text('''\n:root{--type-xs:.6875rem;--type-sm:.8125rem;--type-md:.9375rem;--type-lg:1.125rem;--type-xl:1.375rem;--type-2xl:1.75rem;--type-3xl:2.25rem;--type-4xl:2.75rem;--weight-regular:400;--weight-medium:500;--weight-semibold:650;--weight-bold:750;--weight-black:900;--line-tight:1.12;--line-body:1.55}\nbody{font-size:var(--type-md);line-height:var(--line-body)}\nh1,h2,h3,h4,h5,h6{line-height:var(--line-tight);font-weight:var(--weight-bold)}\n''')
          
          # Shared design tokens; existing module rules can continue to override them locally.
          Path('src/app/visual-system.css').write_text('''\n:root{--vs-bg:#eef4f8;--vs-surface:#fff;--vs-surface-2:#f7fafc;--vs-ink:#102434;--vs-ink-2:#2b4354;--vs-muted:#6d8290;--vs-line:#dbe6ec;--vs-primary:#4169ff;--vs-accent:#1cc7a0;--vs-success:#16866f;--vs-warning:#b56a14;--vs-danger:#b53b4b;--vs-radius-sm:8px;--vs-radius-md:12px;--vs-radius-lg:16px;--vs-radius-xl:20px;--vs-space-1:4px;--vs-space-2:8px;--vs-space-3:12px;--vs-space-4:16px;--vs-space-5:20px;--vs-space-6:24px;--vs-space-7:32px;--vs-shadow-sm:0 6px 18px rgba(19,42,58,.05);--vs-shadow-md:0 12px 30px rgba(19,42,58,.08);--vs-shadow-lg:0 22px 55px rgba(19,42,58,.11)}\n:root[data-theme="dark"]{--vs-bg:#07141c;--vs-surface:#0d1d27;--vs-surface-2:#102632;--vs-ink:#edf7f5;--vs-ink-2:#c1d3d0;--vs-muted:#81979a;--vs-line:#233942;--vs-primary:#6c8cff;--vs-accent:#42d8b8}\nhtml{background:var(--vs-bg)}body{color:var(--vs-ink)}\n.app-card,.module-card,.module-table-wrap,.module-metrics article{border-radius:var(--vs-radius-lg);box-shadow:var(--vs-shadow-md)}\n''')
          PY
      - name: Commit and clean up
        run: |
          git config user.name 'sukuunova-bot'
          git config user.email 'actions@github.com'
          git add src/app/school/timetable/print/PrintStudio.tsx src/components/PayrollWorkspace.tsx src/components/ReportCardPrintStudio.tsx src/app/typography.css src/app/visual-system.css
          git commit -m 'feat: unify school document branding and design tokens'
          git push
          rm .github/workflows/beautify-documents-repair.yml
          git add .github/workflows/beautify-documents-repair.yml
          git commit -m 'chore: remove document beautification repair workflow'
          git push
