name: One-time teacher workspace routing repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair teacher workspace routing and role checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/app/teacher/page.tsx')
          s = p.read_text()
          replacements = {
            'href="/school/homework"': 'href="/teacher/module?view=My%20Homework"',
            'href="/school/attendance"': 'href="/teacher/module?view=My%20Attendance"',
            'href="/school/gradebook"': 'href="/teacher/module?view=My%20Gradebook"',
            'href="/school/timetable"': 'href="/teacher/module?view=My%20Timetable"',
            'href="/school/communications/messages"': 'href="/teacher/module?view=My%20Messages"',
            'href="/school/report-cards"': 'href="/teacher/module?view=My%20Assessments"',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)

          p = Path('src/app/teacher/module/page.tsx')
          s = p.read_text()
          s = s.replace('import { AppShell } from "@/components/AppShell";', 'import { AppShell } from "@/components/AppShell";\nimport { getSchoolAuthorization } from "@/lib/authorization";')
          old = 'const data = await withTenant(session.schoolId, (tx) => tx.user.findUnique({'
          new = 'const data = await withTenant(session.schoolId, async (tx) => { const access = await getSchoolAuthorization(tx, session.userId); const user = await tx.user.findUnique({'
          if old not in s:
              raise SystemExit('module data pattern not found')
          s = s.replace(old, new, 1)
          old = '    },\n  }));\n  if (!data) redirect("/login/school");\n  const roles = data.userRoles.map((entry) => entry.role.name);\n  const teacher = roles.some((role) => /teacher|academic lead|head of department/i.test(role));\n  const elevated = roles.some((role) => /owner|administrator|principal|vice principal/i.test(role));\n  if (!teacher || elevated) redirect("/dashboard");'
          new = '    },\n  }); return { user, access }; });\n  if (!data.user) redirect("/login/school");\n  if (data.access.workspace !== "teacher") redirect("/dashboard");\n  const roles = data.user.userRoles.map((entry) => entry.role.name);\n  const teacher = data.access.isTeacher;\n  if (!teacher) redirect("/dashboard");'
          if old not in s:
              raise SystemExit('module role block pattern not found')
          s = s.replace(old, new, 1)
          s = s.replace('data.classTeacherFor', 'data.user.classTeacherFor').replace('data.subjectAssignments', 'data.user.subjectAssignments').replace('data.name', 'data.user.name')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/teacher/page.tsx src/app/teacher/module/page.tsx
          git commit -m 'fix: keep teacher workspace links and role checks scoped'
          git push
