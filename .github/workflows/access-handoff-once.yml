name: One-time access handoff patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/access-handoff-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch staff activation handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/school/settings/access/page.tsx')
          s = p.read_text()
          s = s.replace('  const [search, setSearch] = useState("");', '  const [search, setSearch] = useState("");\n  const [handoff, setHandoff] = useState<{name:string;login:string;roles:string[];password:string}|null>(null);')
          s = s.replace('  function openUser(user: User) {\n    setSelectedId(user.id);', '  function openUser(user: User) {\n    setHandoff(null);\n    setSelectedId(user.id);')
          old = '''      setMessage(\n        activating\n          ? `${selected.name}\'s staff login is now active.`\n          : `${selected.name}\'s role and direct permission profile was updated.`,\n      );\n      setForm((current) => ({ ...current, password: "" }));'''
          new = '''      if (activating) {\n        setHandoff({\n          name: selected.name,\n          login: selected.email || selected.phone || "No email or phone provided",\n          roles: draftRoles,\n          password: form.password,\n        });\n        setMessage(`${selected.name}\'s staff login is now active.`);\n      } else {\n        setMessage(`${selected.name}\'s role and direct permission profile was updated.`);\n      }\n      setForm((current) => ({ ...current, password: "" }));'''
          if old not in s:
              raise SystemExit('activation block not found')
          s = s.replace(old, new)
          marker = '        {message ? <div className="access-message">{message}</div> : null}'
          replacement = '''        {handoff ? (\n          <section className="access-card" role="status" aria-live="polite">\n            <div className="access-card-head">\n              <div>\n                <span className="access-kicker">ACCOUNT READY</span>\n                <h3>Here is what to tell {handoff.name}</h3>\n                <p>The password below is shown only because you just set it. It is not stored in this handoff panel after you leave or select another account.</p>\n              </div>\n            </div>\n            <div className="access-note">\n              <strong>Login: {handoff.login}</strong><br />\n              <span>Role: {handoff.roles.join(" + ") || "No role"}</span><br />\n              <span>Initial password: <code>{handoff.password}</code></span>\n            </div>\n          </section>\n        ) : null}\n\n        {message ? <div className="access-message">{message}</div> : null}'''
          if marker not in s:
              raise SystemExit('message marker not found')
          s = s.replace(marker, replacement)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/school/settings/access/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(access): show staff login handoff after activation'
          git push