name: Build verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sukuunova_test@localhost:5432/sukuunova_test
      TEST_DATABASE_URL: postgresql://sukuunova_test@localhost:5432/sukuunova_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Create non-superuser test database
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE sukuunova_test LOGIN NOSUPERUSER NOBYPASSRLS;"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE sukuunova_test OWNER sukuunova_test;"
      - name: Install dependencies from lockfile
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Integrate biometric attendance once
        run: |
          set -euo pipefail
          if ! grep -q '^model Device {' prisma/schema.prisma; then
            python scripts/apply-biometric-device-attendance.py
            mkdir -p prisma/migrations/20260831081000_biometric_devices
            cat > prisma/migrations/20260831081000_biometric_devices/migration.sql <<'SQL'
ALTER TABLE "AttendanceEvent" ALTER COLUMN "recordedBy" DROP NOT NULL;
ALTER TABLE "Device" ENABLE ROW LEVEL SECURITY;
ALTER TABLE "Device" FORCE ROW LEVEL SECURITY;
CREATE POLICY "Device_tenant_isolation" ON "Device" USING ("schoolId" = sukuunova_current_school_id()) WITH CHECK ("schoolId" = sukuunova_current_school_id());
ALTER TABLE "DeviceIdentity" ENABLE ROW LEVEL SECURITY;
ALTER TABLE "DeviceIdentity" FORCE ROW LEVEL SECURITY;
CREATE POLICY "DeviceIdentity_tenant_isolation" ON "DeviceIdentity" USING ("schoolId" = sukuunova_current_school_id()) WITH CHECK ("schoolId" = sukuunova_current_school_id());
ALTER TABLE "DeviceAttendanceReceipt" ENABLE ROW LEVEL SECURITY;
ALTER TABLE "DeviceAttendanceReceipt" FORCE ROW LEVEL SECURITY;
CREATE POLICY "DeviceAttendanceReceipt_tenant_isolation" ON "DeviceAttendanceReceipt" USING ("schoolId" = sukuunova_current_school_id()) WITH CHECK ("schoolId" = sukuunova_current_school_id());
SQL
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add prisma/schema.prisma prisma/migrations/20260831081000_biometric_devices src/lib/db.ts src/lib/message-outbox.ts src/lib/attendance-service.ts src/lib/face-service.ts src/app/api/phase2/face/route.ts
            git commit -m 'feat: integrate biometric attendance'
            git push
          else
            echo 'Biometric schema already integrated.'
          fi
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply migrations
        run: npm run db:migrate
      # Verification deliberately runs from the exact commit that triggered this workflow.
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Build application
        env:
          NODE_ENV: production
        run: npm run build
      - name: Release to Railway
        env:
          NODE_ENV: production
        run: |
          printf 'verified %s\n' "$GITHUB_SHA" > .railway-deploy-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .railway-deploy-trigger
          git commit -m "chore: deploy verified build to Railway" || exit 0
          git push
