name: Build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-design:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/system-wide-design-tokens' }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.repair.outputs.changed }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/system-wide-design-tokens
          fetch-depth: 0
      - name: Repair unsafe generated normalization
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sukuunova-design-bot"
          git config user.email "actions@users.noreply.github.com"
          if git log -1 --format=%B | grep -q '\[design-repaired\]'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout e517f3c546b7e21031ad03d09a0f8c0afad71ca1 -- $(git diff --name-only e517f3c546b7e21031ad03d09a0f8c0afad71ca1 45fd44dccf67b0dad4ba7002ddfbcf3d6a953703 -- src)
          node scripts/normalize-design-system.mjs
          rm -f .github/workflows/repair-design-normalization.yml scripts/.design-repair-trigger
          git add src scripts/normalize-design-system.mjs scripts/check-design-tokens.mjs .github/workflows/build.yml .github/workflows/one-shot-design-normalization.yml package.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "fix: safely normalize application design styles [design-repaired]"
          git push origin HEAD:fix/system-wide-design-tokens
          echo "changed=true" >> "$GITHUB_OUTPUT"

  build:
    needs: repair-design
    if: ${{ needs.repair-design.result == 'skipped' || needs.repair-design.outputs.changed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sukuunova_test@localhost:5432/sukuunova_test
      TEST_DATABASE_URL: postgresql://sukuunova_test@localhost:5432/sukuunova_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Create non-superuser test database
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE sukuunova_test LOGIN NOSUPERUSER NOBYPASSRLS;"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE sukuunova_test OWNER sukuunova_test;"
      - name: Install dependencies from lockfile
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Generate ephemeral secrets
        run: |
          echo "SCHOOL_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "GUARDIAN_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "QR_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "FACE_EMBEDDING_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "WHATSAPP_WEBHOOK_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply migrations
        run: npm run db:migrate
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
