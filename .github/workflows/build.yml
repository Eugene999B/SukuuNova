name: Build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sukuunova_test@localhost:5432/sukuunova_test
      TEST_DATABASE_URL: postgresql://sukuunova_test@localhost:5432/sukuunova_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Create non-superuser test databases
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE sukuunova_test LOGIN NOSUPERUSER NOBYPASSRLS;"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE sukuunova_test OWNER sukuunova_test;"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE sukuunova_upgrade OWNER sukuunova_test;"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE sukuunova_restore_drill OWNER sukuunova_test;"
      - name: Install dependencies from lockfile
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Generate ephemeral secrets
        run: |
          for name in SCHOOL_AUTH_SECRET GUARDIAN_AUTH_SECRET QR_AUTH_SECRET PLATFORM_AUTH_SECRET WHATSAPP_WEBHOOK_SECRET BACKUP_ENCRYPTION_KEY; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          value="$(openssl rand -base64 32)"
          echo "::add-mask::$value"
          echo "FACE_EMBEDDING_ENCRYPTION_KEY=$value" >> "$GITHUB_ENV"
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Validate guarded migration deployer syntax
        run: node --check scripts/deploy-migrations.cjs
      - name: Rehearse Railway Release C migration recovery
        env:
          UPGRADE_DATABASE_URL: postgresql://sukuunova_test@localhost:5432/sukuunova_upgrade
        run: bash scripts/rehearse-release-c-migration-recovery.sh
      - name: Apply migrations through production deployer
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Pilot smoke journeys
        run: npm run test:pilot-smoke
      - name: Eugene Academy full-system fixture
        env:
          DATABASE_URL: postgresql://production-sentinel.invalid/sukuunova
          TEST_DATABASE_URL: postgresql://sukuunova_test@localhost:5432/sukuunova_test
          ALLOW_EUGENE_ACADEMY_TRIAL_SEED: YES
          TEST_STUDENT_COUNT: "225"
        run: |
          export EUGENE_ACADEMY_TEST_PASSWORD="$(openssl rand -base64 24 | tr -d '\n')"
          npm run test:seed-eugene
      - name: Complete and verify Eugene academic demonstration twice
        env:
          NODE_ENV: production
          ALLOW_EUGENE_ACADEMY_ACADEMIC_DEMO: EUGENE_ACADEMY_ONLY
        run: |
          npx tsx scripts/complete-eugene-academic-demo.ts
          npx tsx scripts/complete-eugene-academic-demo.ts
      - name: Encrypted backup and isolated restore drill
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/sukuunova_test
          RESTORE_DATABASE_URL: postgresql://postgres@localhost:5432/sukuunova_restore_drill
          BACKUP_DIR: /tmp/sukuunova-ci-backup
        run: |
          npx tsx scripts/db-backup.ts
          manifests=("$BACKUP_DIR"/*.manifest.json)
          test "${#manifests[@]}" -eq 1
          BACKUP_MANIFEST="${manifests[0]}" npx tsx scripts/db-restore-verify.ts
          for table in School Student ReportCard Payment; do
            source_count=$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM \"$table\";")
            restored_count=$(psql "$RESTORE_DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM \"$table\";")
            test "$source_count" = "$restored_count"
            echo "$table: restored $restored_count records"
          done
      - name: Clean-state reset rehearsal
        env:
          RESET_DATABASE_URL: postgresql://sukuunova_test@localhost:5432/sukuunova_test
          ALLOW_APPLICATION_DATA_RESET: YES_DELETE_APPLICATION_DATA
          RESET_CONFIRM_DATABASE_NAME: sukuunova_test
        run: |
          RESET_MODE=preview npm run data:reset
          RESET_MODE=execute npm run data:reset
          npm run data:verify-empty
      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium
      - name: Browser smoke against the production build
        env:
          NODE_ENV: production
          APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: |
          node scripts/start-production.cjs > /tmp/sukuunova-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          npx tsx scripts/browser-smoke.ts
      - name: Browser server diagnostics
        if: failure()
        run: test ! -f /tmp/sukuunova-browser-server.log || tail -n 100 /tmp/sukuunova-browser-server.log
