name: Build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sukuunova_test@localhost:5432/sukuunova_test
      TEST_DATABASE_URL: postgresql://sukuunova_test@localhost:5432/sukuunova_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Create non-superuser test databases
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE sukuunova_test LOGIN NOSUPERUSER NOBYPASSRLS;"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE sukuunova_test OWNER sukuunova_test;"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE sukuunova_upgrade OWNER sukuunova_test;"
      - name: Install dependencies from lockfile
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Generate ephemeral secrets
        run: |
          echo "SCHOOL_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "GUARDIAN_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "QR_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PLATFORM_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "FACE_EMBEDDING_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "WHATSAPP_WEBHOOK_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Validate guarded migration deployer syntax
        run: node --check scripts/deploy-migrations.cjs
      - name: Rehearse Railway Release C migration recovery
        env:
          UPGRADE_DATABASE_URL: postgresql://sukuunova_test@localhost:5432/sukuunova_upgrade
        run: bash scripts/rehearse-release-c-migration-recovery.sh
      - name: Apply migrations through production deployer
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Pilot smoke journeys
        run: npm run test:pilot-smoke
      - name: Eugene Academy full-system fixture
        env:
          DATABASE_URL: postgresql://production-sentinel.invalid/sukuunova
          TEST_DATABASE_URL: postgresql://sukuunova_test@localhost:5432/sukuunova_test
          ALLOW_EUGENE_ACADEMY_TRIAL_SEED: YES
          TEST_STUDENT_COUNT: "225"
        run: |
          export EUGENE_ACADEMY_TEST_PASSWORD="$(openssl rand -base64 24 | tr -d '\n')"
          npm run test:seed-eugene
      - name: Clean-state reset rehearsal
        env:
          RESET_DATABASE_URL: postgresql://sukuunova_test@localhost:5432/sukuunova_test
          ALLOW_APPLICATION_DATA_RESET: YES_DELETE_APPLICATION_DATA
          RESET_CONFIRM_DATABASE_NAME: sukuunova_test
        run: |
          RESET_MODE=preview npm run data:reset
          RESET_MODE=execute npm run data:reset
          npm run data:verify-empty
      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
