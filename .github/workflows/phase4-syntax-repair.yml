name: Phase 4 syntax repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only escaped template-literal backticks
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/lib/phase4-service.ts')
          s = p.read_text()
          before = s.count('\\`')
          assert before > 0, 'No escaped backticks found; refusing unrelated edit.'
          s = s.replace('\\`', '`')
          p.write_text(s)
          after = s.count('\\`')
          assert after == 0, f'{after} escaped backticks remain'
          print(f'Fixed {before} escaped backticks.')
          PY
          git diff --check
      - name: Commit and remove repair workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/phase4-syntax-repair.yml
          git add src/lib/phase4-service.ts .github/workflows/phase4-syntax-repair.yml
          git commit -m 'fix: restore phase4 template literal syntax'
          git push
