name: Repair calendar Prisma schema

on:
  push:
    branches: [main]
    paths:
      - ".github/repair-calendar-schema"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore CalendarEvent Prisma model
        shell: python
        run: |
          from pathlib import Path

          path = Path("prisma/schema.prisma")
          text = path.read_text()

          if "model CalendarEvent {" in text and "events    CalendarEvent[]" in text:
              print("CalendarEvent already present; nothing to do")
              raise SystemExit(0)

          old = '''model AcademicYear {
            id        String   @id @default(cuid())
            schoolId  String
            name      String
            startDate DateTime
            endDate   DateTime
            isLocked  Boolean  @default(false)
            school    School   @relation(fields: [schoolId], references: [id], onDelete: Restrict)
            terms     Term[]
            @@unique([id, schoolId])
            @@unique([schoolId, name])
            @@index([schoolId])
          }

          model Term {'''

          new = '''model AcademicYear {
            id        String   @id @default(cuid())
            schoolId  String
            name      String
            startDate DateTime
            endDate   DateTime
            isLocked  Boolean  @default(false)
            school    School   @relation(fields: [schoolId], references: [id], onDelete: Restrict)
            events    CalendarEvent[]
            terms     Term[]
            @@unique([id, schoolId])
            @@unique([schoolId, name])
            @@index([schoolId])
          }

          model CalendarEvent {
            id                String       @id @default(cuid())
            schoolId          String
            academicYearId    String
            type              String
            name              String
            startDate         DateTime
            endDate           DateTime
            affectsAttendance Boolean      @default(true)
            affectsTransport  Boolean      @default(false)
            school            School       @relation(fields: [schoolId], references: [id], onDelete: Restrict)
            academicYear      AcademicYear @relation(fields: [academicYearId, schoolId], references: [id, schoolId], onDelete: Cascade)
            @@unique([id, schoolId])
            @@index([schoolId])
            @@index([schoolId, startDate, endDate])
          }

          model Term {'''

          if old not in text:
              raise SystemExit("Expected AcademicYear block not found; refusing to modify schema")

          path.write_text(text.replace(old, new, 1))
          print("Restored CalendarEvent Prisma model")
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prisma/schema.prisma
          git commit -m 'fix(schema): restore calendar event model'
          git push
