name: SukuuNova design normalization

on:
  push:
    branches:
      - fix/system-wide-design-final
      - main

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[design-normalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: node scripts/apply-design-shell.mjs
      - run: node scripts/normalize-design-system.mjs
      - run: npm run lint
      - run: npx tsc --noEmit --pretty false
      - name: Commit normalized design source
        shell: bash
        run: |
          git config user.name "sukuunova-design-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src package.json scripts
          if git diff --cached --quiet; then
            echo "No design changes to commit."
            exit 0
          fi
          git commit -m "chore: normalize application design system [design-normalized]"
          git push
