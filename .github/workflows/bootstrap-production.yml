name: SukuuNova production bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-production.yml

permissions:
  contents: read
  statuses: write

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'bootstrap probe')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.SUKUUNOVA_DATABASE_URL }}
      SEED_SCHOOL_CODE: ${{ secrets.SEED_SCHOOL_CODE }}
      SEED_SCHOOL_NAME: ${{ secrets.SEED_SCHOOL_NAME }}
      SEED_OWNER_NAME: ${{ secrets.SEED_OWNER_NAME }}
      SEED_OWNER_EMAIL: ${{ secrets.SEED_OWNER_EMAIL }}
      SEED_OWNER_PASSWORD: ${{ secrets.SEED_OWNER_PASSWORD }}
      SEED_PLATFORM_ADMIN_EMAIL: ${{ secrets.SEED_PLATFORM_ADMIN_EMAIL }}
      SEED_PLATFORM_ADMIN_PASSWORD: ${{ secrets.SEED_PLATFORM_ADMIN_PASSWORD }}
      SEED_PLATFORM_ADMIN_NAME: ${{ secrets.SEED_PLATFORM_ADMIN_NAME }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate bootstrap secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUKUUNOVA_DATABASE_URL SEED_SCHOOL_CODE SEED_SCHOOL_NAME SEED_OWNER_NAME SEED_OWNER_EMAIL SEED_OWNER_PASSWORD SEED_PLATFORM_ADMIN_EMAIL SEED_PLATFORM_ADMIN_PASSWORD SEED_PLATFORM_ADMIN_NAME; do
            test -n "${!name:-}" || { echo "$name is missing" >&2; exit 1; }
          done
          test "${#SEED_OWNER_PASSWORD}" -ge 12 || { echo "SEED_OWNER_PASSWORD must be at least 12 characters" >&2; exit 1; }
          test "${#SEED_PLATFORM_ADMIN_PASSWORD}" -ge 12 || { echo "SEED_PLATFORM_ADMIN_PASSWORD must be at least 12 characters" >&2; exit 1; }

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed initial school and platform administrator
        run: npx prisma db seed

      - name: Report bootstrap result
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$BOOTSTRAP_STATUS" = "success" ]; then
            STATE=success
            DESCRIPTION="SukuuNova production database migration and seed completed"
          else
            STATE=failure
            DESCRIPTION="SukuuNova production bootstrap failed; inspect the workflow log"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"SukuuNova production bootstrap\",\"description\":\"${DESCRIPTION}\"}" >/dev/null
