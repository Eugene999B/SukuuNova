name: SukuuNova production bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.SUKUUNOVA_DATABASE_URL }}
      SEED_SCHOOL_CODE: ${{ secrets.SEED_SCHOOL_CODE }}
      SEED_SCHOOL_NAME: ${{ secrets.SEED_SCHOOL_NAME }}
      SEED_OWNER_NAME: ${{ secrets.SEED_OWNER_NAME }}
      SEED_OWNER_EMAIL: ${{ secrets.SEED_OWNER_EMAIL }}
      SEED_OWNER_PASSWORD: ${{ secrets.SEED_OWNER_PASSWORD }}
      SEED_PLATFORM_ADMIN_EMAIL: ${{ secrets.SEED_PLATFORM_ADMIN_EMAIL }}
      SEED_PLATFORM_ADMIN_PASSWORD: ${{ secrets.SEED_PLATFORM_ADMIN_PASSWORD }}
      SEED_PLATFORM_ADMIN_NAME: ${{ secrets.SEED_PLATFORM_ADMIN_NAME }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        id: install
        run: npm install --no-audit --no-fund

      - name: Validate bootstrap secrets
        id: validate
        shell: bash
        run: |
          set -uo pipefail
          missing=()
          for name in SUKUUNOVA_DATABASE_URL SEED_SCHOOL_CODE SEED_SCHOOL_NAME SEED_OWNER_NAME SEED_OWNER_EMAIL SEED_OWNER_PASSWORD SEED_PLATFORM_ADMIN_EMAIL SEED_PLATFORM_ADMIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"
            echo "Missing bootstrap secret(s): ${missing[*]}" >&2
            exit 1
          fi
          if [ "${#SEED_OWNER_PASSWORD}" -lt 12 ]; then
            echo "missing=SEED_OWNER_PASSWORD(length)" >> "$GITHUB_OUTPUT"
            echo "SEED_OWNER_PASSWORD must contain at least 12 characters" >&2
            exit 1
          fi
          if [ "${#SEED_PLATFORM_ADMIN_PASSWORD}" -lt 12 ]; then
            echo "missing=SEED_PLATFORM_ADMIN_PASSWORD(length)" >> "$GITHUB_OUTPUT"
            echo "SEED_PLATFORM_ADMIN_PASSWORD must contain at least 12 characters" >&2
            exit 1
          fi
          echo "missing=" >> "$GITHUB_OUTPUT"

      - name: Apply database migrations
        id: migrate
        run: npx prisma migrate deploy

      - name: Seed initial school and platform administrator
        id: seed
        run: npx prisma db seed

      - name: Report bootstrap result
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SETUP_NODE_OUTCOME: ${{ steps.setup_node.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          MIGRATE_OUTCOME: ${{ steps.migrate.outcome }}
          SEED_OUTCOME: ${{ steps.seed.outcome }}
          MISSING_SECRETS: ${{ steps.validate.outputs.missing }}
        run: |
          set -euo pipefail
          if [ "$SETUP_NODE_OUTCOME" = "success" ] && \
             [ "$INSTALL_OUTCOME" = "success" ] && \
             [ "$VALIDATE_OUTCOME" = "success" ] && \
             [ "$MIGRATE_OUTCOME" = "success" ] && \
             [ "$SEED_OUTCOME" = "success" ]; then
            STATE=success
            DESCRIPTION="SukuuNova production database migration and seed completed"
          else
            STATE=failure
            DESCRIPTION="SukuuNova production bootstrap failed"
            if [ -n "$MISSING_SECRETS" ]; then
              DESCRIPTION="SukuuNova production bootstrap validation failed: $MISSING_SECRETS"
            fi
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"SukuuNova production bootstrap\",\"description\":\"${DESCRIPTION}\"}" >/dev/null
