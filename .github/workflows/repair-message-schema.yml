name: Repair message Prisma schema

on:
  push:
    branches: [main]
    paths:
      - ".github/repair-message-schema"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align Message idempotency field
        shell: python
        run: |
          from pathlib import Path
          p = Path("prisma/schema.prisma")
          text = p.read_text()
          if '  idempotencyKey String' in text:
              print("Message idempotency field already present; nothing to do")
              raise SystemExit(0)
          old = '''  lastError String?\n  createdAt DateTime @default(now())\n  school School @relation(fields: [schoolId], references: [id], onDelete: Restrict)\n  @@unique([id, schoolId])\n  @@index([schoolId])'''
          new = '''  lastError String?\n  idempotencyKey String\n  createdAt DateTime @default(now())\n  school School @relation(fields: [schoolId], references: [id], onDelete: Restrict)\n  @@unique([id, schoolId])\n  @@unique([schoolId, idempotencyKey])\n  @@index([schoolId])'''
          if old not in text:
              raise SystemExit("Expected Message model block not found; refusing to modify schema")
          p.write_text(text.replace(old, new, 1))
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prisma/schema.prisma
          git commit -m 'fix(schema): align message idempotency field'
          git push
