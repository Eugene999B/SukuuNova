name: Prepare launch print dependencies
on:
  push:
    branches: [fix/launch-integrity-2026-09-15]
    paths: [.github/workflows/prepare-launch-assets.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/launch-integrity-2026-09-15
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lock Unicode PDF dependencies and vendor fonts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact @pdf-lib/fontkit@1.1.1
          mkdir -p public/fonts
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/notofonts/noto-fonts/ffebf8c1ee449e544955a7e813c54f9b73848eac/hinted/ttf/NotoSans/NotoSans-Regular.ttf -o public/fonts/NotoSans-Regular.ttf
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/notofonts/noto-fonts/ffebf8c1ee449e544955a7e813c54f9b73848eac/LICENSE -o public/fonts/OFL.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/fonts
          git commit -m "Vendor Unicode receipt font and lock PDF font support"
          git push origin HEAD:fix/launch-integrity-2026-09-15
