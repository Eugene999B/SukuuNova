name: SukuuNova operational repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch repository with assertions
        env:
          TARGET_SHA: 37cf8e60c49219650854089dada5337abc130174
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text()
          def write(p,s): Path(p).write_text(s)
          def replace_once(p, old, new):
              s=read(p)
              n=s.count(old)
              assert n==1, f'{p}: expected one match, got {n}'
              write(p,s.replace(old,new))

          # User lifecycle state
          replace_once('prisma/schema.prisma',
              '  status              String   @default("active")\n  createdAt           DateTime',
              '  status              String   @default("active")\n  needsPasswordChange Boolean  @default(false)\n  createdAt           DateTime')

          # Login reads authoritative lifecycle state.
          replace_once('src/lib/login-service.ts',
              'SELECT u."id", u."schoolId", u."name", u."passwordHash", u."status" FROM "User" u',
              'SELECT u."id", u."schoolId", u."name", u."passwordHash", u."status", u."needsPasswordChange" FROM "User" u')
          replace_once('src/lib/login-service.ts',
              'return { userId: user.id, schoolId: user.schoolId, name: user.name, schoolName: school.name, portal, roles: roleEntries.map((role) => role.name), roleKeys, needsPasswordChange: false };',
              'return { userId: user.id, schoolId: user.schoolId, name: user.name, schoolName: school.name, portal, roles: roleEntries.map((role) => role.name), roleKeys, needsPasswordChange: Boolean(user.needsPasswordChange) };')

          # New onboarded owners must change their password.
          replace_once('src/lib/onboarding-service.ts',
              'passwordHash: ownerPasswordHash\n      }',
              'passwordHash: ownerPasswordHash,\n        needsPasswordChange: true\n      }')

          # Completing the password change clears the authoritative state.
          replace_once('src/app/account/security/page.tsx',
              'data: { passwordHash: await hash(next, 12) }',
              'data: { passwordHash: await hash(next, 12), needsPasswordChange: false }')

          # Make teacher attendance a real dedicated workspace route.
          p=Path('src/app/teacher/attendance/page.tsx')
          p.parent.mkdir(parents=True, exist_ok=True)
          assert not p.exists(), 'teacher attendance page unexpectedly exists'
          p.write_text('''import Link from "next/link";\nimport { redirect } from "next/navigation";\nimport { AppShell } from "@/components/AppShell";\nimport { getSchoolAuthorization } from "@/lib/authorization";\nimport { requireSchoolSession } from "@/lib/school-auth";\nimport { withTenant } from "@/lib/db";\nimport { hasPermission } from "@/lib/rbac";\nimport { recordAttendance } from "@/lib/attendance-service";\n\nasync function saveAttendance(formData: FormData) {\n  "use server";\n  const session = await requireSchoolSession();\n  const studentId = String(formData.get("studentId") || "").trim();\n  const attendanceDate = String(formData.get("attendanceDate") || "").trim();\n  const type = String(formData.get("type") || "present").trim();\n  if (!studentId || !/^\\d{4}-\\d{2}-\\d{2}$/.test(attendanceDate) || !["in","out"].includes(type)) throw new Error("Invalid attendance input.");\n  await withTenant(session.schoolId, async tx => {\n    const access = await getSchoolAuthorization(tx, session.userId);\n    if (access.workspace !== "teacher" || !(await hasPermission(tx, session.userId, "attendance:record"))) throw new Error("You do not have teacher attendance access.");\n    const student = await tx.student.findUnique({ where: { id: studentId }, select: { id: true, classId: true } });\n    if (!student?.classId) throw new Error("Student is not assigned to a class.");\n    const assigned = await tx.class.findFirst({ where: { id: student.classId, OR: [{ classTeacherId: session.userId }, { subjectAssignments: { some: { teacherId: session.userId } } }] }, select: { id: true } });\n    if (!assigned) throw new Error("That student is outside your teaching scope.");\n    await recordAttendance(tx, { schoolId: session.schoolId, actorId: session.userId, target: { studentId }, type, method: "teacher_register", timestamp: new Date(`${attendanceDate}T08:00:00.000Z`) });\n  });\n  redirect(`/teacher/attendance?date=${attendanceDate}`);\n}\n\nexport default async function TeacherAttendancePage({ searchParams }: { searchParams: Promise<{ date?: string }> }) {\n  const session = await requireSchoolSession();\n  const date = (await searchParams).date?.match(/^\\d{4}-\\d{2}-\\d{2}$/)?.[0] || new Date().toISOString().slice(0,10);\n  const data = await withTenant(session.schoolId, async tx => {\n    const access = await getSchoolAuthorization(tx, session.userId);\n    if (access.workspace !== "teacher") redirect("/dashboard");\n    const [school, classes, students, events] = await Promise.all([\n      tx.school.findUnique({ where: { id: session.schoolId }, select: { name: true, uniqueCode: true } }),\n      tx.class.findMany({ where: { OR: [{ classTeacherId: session.userId }, { subjectAssignments: { some: { teacherId: session.userId } } }] }, orderBy: { name: "asc" }, select: { id: true, name: true, level: true } }),\n      tx.student.findMany({ where: { status: "active", class: { OR: [{ classTeacherId: session.userId }, { subjectAssignments: { some: { teacherId: session.userId } } }] } }, orderBy: { name: "asc" }, select: { id: true, name: true, admissionNo: true, class: { select: { name: true, level: true } } } }),\n      tx.attendanceEvent.findMany({ where: { attendanceDate: new Date(`${date}T00:00:00.000Z`), studentId: { not: null }, student: { class: { OR: [{ classTeacherId: session.userId }, { subjectAssignments: { some: { teacherId: session.userId } } }] } } }, include: { student: { select: { name: true, admissionNo: true, class: { select: { name: true, level: true } } } } }, orderBy: { timestamp: "desc" }, take: 300 })\n    ]);\n    return { access, school, classes, students, events };\n  });\n  const recorded = new Set(data.events.map(e => e.studentId).filter(Boolean));\n  return <AppShell universe="teacher" title="My attendance" subtitle="Take attendance only for learners in your assigned teaching groups." active="My Attendance" schoolName={data.school?.name ?? "School Workspace"} schoolCode={data.school?.uniqueCode ?? ""} userName={session.name} role="Teacher">\n    <div className="module-workspace">\n      <section className="module-setup-card module-card"><div><span className="module-overline">Teacher register</span><h3>Your attendance scope</h3><p>This page exposes only students in classes where you are the class teacher or subject teacher. School-wide attendance stays outside the teacher portal.</p></div><div className="module-setup-list"><Link href="/teacher">↩ Teacher home</Link><Link href="/teacher/module?view=My%20Gradebook">Open my gradebook</Link><Link href="/teacher/module?view=My%20Homework">Open my homework</Link></div></section>\n      <section className="module-metrics"><article><span>Assigned classes</span><strong>{data.classes.length}</strong><small>Classes in your scope</small></article><article><span>Students in scope</span><strong>{data.students.length}</strong><small>Eligible learners</small></article><article><span>Recorded</span><strong>{recorded.size}</strong><small>Attendance decisions on {date}</small></article><article><span>Remaining</span><strong>{Math.max(0,data.students.length-recorded.size)}</strong><small>Still need a decision</small></article></section>\n      <section className="module-card"><div className="module-section-title"><div><span>Record attendance · {date}</span><h3>Teacher register</h3><p>One attendance decision per learner for the selected date. The server rejects learners outside your teaching scope.</p></div></div><form action={saveAttendance} style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:10,marginTop:15}}><input type="date" name="attendanceDate" defaultValue={date} required /><select name="studentId" required defaultValue=""><option value="">Choose learner</option>{data.students.map(s => <option key={s.id} value={s.id}>{s.name} · {s.class?.name ?? "Unassigned"}</option>)}</select><select name="type" defaultValue="in"><option value="in">Present / in</option><option value="out">Absent / out</option></select><button className="module-hero-button" type="submit">Save attendance →</button></form></section>\n      <section className="module-card"><div className="module-section-title"><div><span>Today in your scope</span><h3>Recorded attendance</h3></div></div><div className="module-workflow">{data.events.map(e => <div className="module-workflow-step" key={e.id}><span>{e.type.slice(0,1).toUpperCase()}</span><div><strong>{e.student?.name ?? "Unknown"}</strong><small>{e.student?.admissionNo ?? ""} · {e.student?.class?.name ?? ""} · {e.type}</small></div></div>)}{!data.events.length ? <div className="module-empty"><strong>No attendance recorded yet.</strong><p>Choose a learner above to begin today’s register.</p></div> : null}</div></section>\n    </div>\n  </AppShell>;\n}\n''')

          # Teacher nav: attendance is now a direct real workspace; School Life is removed from the school shell.
          replace_once('src/components/AppShell.tsx',
              '["◉", "My Attendance", teacherModule("My Attendance")]',
              '["◉", "My Attendance", "/teacher/attendance"]')
          replace_once('src/components/AppShell.tsx',
              '  { label: "School Life", items: [["▦", "Library", "/school/library"], ["⌁", "Transport", "/school/transport"], ["☕", "Feeding", "/school/feeding"], ["▧", "Assets & Inventory", "/school/inventory"], ["♙", "Recruitment", "/school/hr/recruitment"]] },\n',
              '')

          # Public homepage: module cards stay on public marketing routes, never protected application routes.
          s=read('src/app/page.tsx')
          old='''const modules = [\n  ["Students", "Admissions, records, guardians and learner journeys", "01", "/school/students"],\n  ["Academics", "Classes, subjects, timetable, homework and results", "02", "/school/subjects"],\n  ["Attendance", "Daily registers, lateness, absence and alerts", "03", "/school/attendance"],\n  ["Fees & finance", "Invoices, receipts, balances and collections", "04", "/school/fees"],\n  ["Communication", "Guardians, announcements, SMS, WhatsApp and events", "05", "/school/communications/announcements"],\n  ["People & HR", "Teachers, staff, roles, leave and payroll", "06", "/school/staff"],\n];'''
          new='''const modules = [\n  ["Students", "Admissions, records, guardians and learner journeys", "01", "/features"],\n  ["Academics", "Classes, subjects, timetable, homework and results", "02", "/features"],\n  ["Attendance", "Daily registers, lateness, absence and alerts", "03", "/features"],\n  ["Fees & finance", "Invoices, receipts, balances and collections", "04", "/features"],\n  ["Communication", "Guardians, announcements, SMS, WhatsApp and events", "05", "/features"],\n  ["People & HR", "Teachers, staff, roles, leave and payroll", "06", "/features"],\n];'''
          assert s.count(old)==1, 'homepage module list mismatch'
          write('src/app/page.tsx',s.replace(old,new))

          # Truthful setup readiness: branding is data-backed, students and activated non-owner staff included.
          p='src/app/dashboard/page.tsx'
          s=read(p)
          old='''        pendingStaff,\n      ] = await Promise.all(['''
          new='''        pendingStaff,\n        activatedNonOwnerStaff,\n        hasBranding,\n      ] = await Promise.all(['''
          assert s.count(old)==1, 'dashboard Promise target mismatch'
          s=s.replace(old,new)
          old='''        tx.user.count({\n          where: {\n            status: "pending",\n            userRoles: { some: { role: { key: { notIn: ["guardian", "parent", "student"] } } } },\n          },\n        }),\n      ]);'''
          new='''        tx.user.count({\n          where: {\n            status: "pending",\n            userRoles: { some: { role: { key: { notIn: ["guardian", "parent", "student"] } } } },\n          },\n        }),\n        tx.user.count({\n          where: { status: "active", NOT: { userRoles: { some: { role: { key: "owner" } } } }, userRoles: { some: { role: { key: { notIn: ["guardian", "parent", "student"] } } } } },\n        }),\n        tx.school.findUnique({ where: { id: schoolSession.schoolId }, select: { logoUrl: true, brandColors: true, name: true, uniqueCode: true } }).then(s => Boolean(s?.logoUrl || s?.brandColors)),\n      ]);'''
          assert s.count(old)==1, 'dashboard Promise tail mismatch'
          s=s.replace(old,new)
          old='''        pendingStaff,\n      };'''
          new='''        pendingStaff,\n        activatedNonOwnerStaff,\n        hasBranding,\n      };'''
          assert s.count(old)==1, 'dashboard return mismatch'
          s=s.replace(old,new)
          old='''  pendingStaff: number; pendingReportCards: number; pendingFeeAdjustments: number;\n};'''
          new='''  pendingStaff: number; pendingReportCards: number; pendingFeeAdjustments: number; activatedNonOwnerStaff: number; hasBranding: boolean;\n};'''
          assert s.count(old)==1, 'dashboard type mismatch'
          s=s.replace(old,new)
          old='''    ["School profile & branding", true, "/school/settings"],\n    ["Academic calendar", stats.academicYears > 0 && stats.terms > 0, "/school/terms"],\n    ["Classes & subjects", stats.classes > 0 && stats.subjects > 0, "/school/classes"],\n    ["Staff accounts", stats.staff > 0 && stats.pendingStaff === 0, "/school/staff"],\n    ["Fee structure", stats.feeItems > 0, "/school/fees"],\n    ["Report-card templates", stats.reportTemplates > 0, "/school/report-cards"],'''
          new='''    ["School profile & branding", Boolean(stats.hasBranding), "/school/settings"],\n    ["Academic calendar", stats.academicYears > 0 && stats.terms > 0, "/school/terms"],\n    ["Classes & subjects", stats.classes > 0 && stats.subjects > 0, "/school/classes"],\n    ["Staff accounts", stats.activatedNonOwnerStaff > 0 && stats.pendingStaff === 0, "/school/settings/access"],\n    ["Students", stats.students > 0, "/school/students"],\n    ["Fee structure", stats.feeItems > 0, "/school/fees"],\n    ["Report-card templates", stats.reportTemplates > 0, "/school/report-cards"],'''
          assert s.count(old)==1, 'dashboard setup list mismatch'
          s=s.replace(old,new)
          write(p,s)

          # Add migration.
          m=Path('prisma/migrations/20260831050000_operational_lifecycle/migration.sql')
          m.parent.mkdir(parents=True, exist_ok=True)
          assert not m.exists(), 'migration already exists'
          m.write_text('ALTER TABLE "User" ADD COLUMN "needsPasswordChange" BOOLEAN NOT NULL DEFAULT false;\n')

          # Remove this repair workflow after it has committed the operational change.
          wf=Path('.github/workflows/sukuunova-ops-repair.yml')
          # Keep a marker only; this file is deleted by the commit step below.
          print('Guarded patch completed.')
          PY

      - name: Verify repository state
        run: |
          git diff --check
          test -f prisma/migrations/20260831050000_operational_lifecycle/migration.sql
          grep -q 'needsPasswordChange Boolean' prisma/schema.prisma
          grep -q 'needsPasswordChange' src/lib/login-service.ts
          grep -q '/teacher/attendance' src/components/AppShell.tsx
          grep -q 'School profile & branding' src/app/dashboard/page.tsx

      - name: Commit and remove repair workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prisma/schema.prisma prisma/migrations/20260831050000_operational_lifecycle/migration.sql src/lib/login-service.ts src/lib/onboarding-service.ts src/app/account/security/page.tsx src/app/teacher/attendance/page.tsx src/components/AppShell.tsx src/app/page.tsx src/app/dashboard/page.tsx .github/workflows/sukuunova-ops-repair.yml
          rm .github/workflows/sukuunova-ops-repair.yml
          git add -u .github/workflows/sukuunova-ops-repair.yml
          git commit -m 'fix: make teacher and onboarding workflows operational'
          git push
