name: SukuuNova operational repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply idempotent operational repair
        run: |
          python3 <<'PY'
          from pathlib import Path
          def read(p): return Path(p).read_text()
          def write(p,s): Path(p).write_text(s)
          def add_once(p, old, new):
              s=read(p)
              if old in s:
                  write(p,s.replace(old,new,1))
                  return True
              return False

          # User lifecycle state.
          p='prisma/schema.prisma'; s=read(p); start=s.index('model User {'); end=s.index('\n}\n\nmodel Role {',start); block=s[start:end]
          if 'needsPasswordChange' not in block:
              lines=block.splitlines(); matches=[i for i,line in enumerate(lines) if line.strip().startswith('status ') and '@default("active")' in line]
              assert len(matches)==1, f'User status target count={len(matches)}'
              lines.insert(matches[0]+1,'  needsPasswordChange Boolean  @default(false)'); write(p,s[:start]+'\n'.join(lines)+s[end:])

          # Login exposes the stored state.
          p='src/lib/login-service.ts'; s=read(p)
          if 'needsPasswordChange' not in s:
              old='u."passwordHash", u."status"'; assert s.count(old)==1, 'login select target missing'; s=s.replace(old,'u."passwordHash", u."status", u."needsPasswordChange"',1)
              old='needsPasswordChange: false'; assert s.count(old)==1, 'login return target missing'; s=s.replace(old,'needsPasswordChange: Boolean(user.needsPasswordChange)',1); write(p,s)

          # Onboarded Owner starts in required-change state.
          p='src/lib/onboarding-service.ts'; s=read(p)
          if 'needsPasswordChange: true' not in s: add_once(p,'passwordHash: ownerPasswordHash','passwordHash: ownerPasswordHash,\n        needsPasswordChange: true')

          # Completing a school password change clears the state.
          p='src/app/account/security/page.tsx'; s=read(p)
          if 'needsPasswordChange: false' not in s: add_once(p,'data: { passwordHash: await hash(next, 12) }','data: { passwordHash: await hash(next, 12), needsPasswordChange: false }')

          # Dedicated teacher attendance workspace.
          p='src/app/teacher/attendance/page.tsx'
          if not Path(p).exists():
              Path(p).parent.mkdir(parents=True,exist_ok=True)
              Path(p).write_text('''import Link from "next/link";\nimport { redirect } from "next/navigation";\nimport { AppShell } from "@/components/AppShell";\nimport { getSchoolAuthorization } from "@/lib/authorization";\nimport { requireSchoolSession } from "@/lib/school-auth";\nimport { withTenant } from "@/lib/db";\nimport { hasPermission } from "@/lib/rbac";\nimport { recordAttendance } from "@/lib/attendance-service";\n\nasync function saveAttendance(formData: FormData) {\n  "use server";\n  const session = await requireSchoolSession();\n  const studentId = String(formData.get("studentId") || "").trim();\n  const attendanceDate = String(formData.get("attendanceDate") || "").trim();\n  const type = String(formData.get("type") || "in").trim();\n  if (!studentId || !/^\\d{4}-\\d{2}-\\d{2}$/.test(attendanceDate) || !["in","out"].includes(type)) throw new Error("Invalid attendance input.");\n  await withTenant(session.schoolId, async tx => {\n    const access = await getSchoolAuthorization(tx, session.userId);\n    if (access.workspace !== "teacher" || !(await hasPermission(tx, session.userId, "attendance:record"))) throw new Error("You do not have teacher attendance access.");\n    const student = await tx.student.findUnique({ where: { id: studentId }, select: { id: true, classId: true } });\n    if (!student?.classId) throw new Error("Student is not assigned to a class.");\n    const assigned = await tx.class.findFirst({ where: { id: student.classId, OR: [{ classTeacherId: session.userId }, { subjectAssignments: { some: { teacherId: session.userId } } }] }, select: { id: true } });\n    if (!assigned) throw new Error("That student is outside your teaching scope.");\n    await recordAttendance(tx, { schoolId: session.schoolId, actorId: session.userId, target: { studentId }, type, method: "teacher_register", timestamp: new Date(`${attendanceDate}T08:00:00.000Z`) });\n  });\n  redirect(`/teacher/attendance?date=${attendanceDate}`);\n}\n\nexport default async function TeacherAttendancePage({ searchParams }: { searchParams: Promise<{ date?: string }> }) {\n  const session = await requireSchoolSession();\n  const date = (await searchParams).date?.match(/^\\d{4}-\\d{2}-\\d{2}$/)?.[0] || new Date().toISOString().slice(0,10);\n  const data = await withTenant(session.schoolId, async tx => {\n    const access = await getSchoolAuthorization(tx, session.userId);\n    if (access.workspace !== "teacher") redirect("/dashboard");\n    const [school, classes, students, events] = await Promise.all([\n      tx.school.findUnique({ where: { id: session.schoolId }, select: { name: true, uniqueCode: true } }),\n      tx.class.findMany({ where: { OR: [{ classTeacherId: session.userId }, { subjectAssignments: { some: { teacherId: session.userId } } }] }, orderBy: { name: "asc" }, select: { id: true, name: true, level: true } }),\n      tx.student.findMany({ where: { status: "active", class: { OR: [{ classTeacherId: session.userId }, { subjectAssignments: { some: { teacherId: session.userId } }] } } }, orderBy: { name: "asc" }, select: { id: true, name: true, admissionNo: true, class: { select: { name: true, level: true } } } }),\n      tx.attendanceEvent.findMany({ where: { attendanceDate: new Date(`${date}T00:00:00.000Z`), studentId: { not: null }, student: { class: { OR: [{ classTeacherId: session.userId }, { subjectAssignments: { some: { teacherId: session.userId } } }] } } }, include: { student: { select: { name: true, admissionNo: true, class: { select: { name: true, level: true } } } } }, orderBy: { timestamp: "desc" }, take: 300 })\n    ]);\n    return { school, classes, students, events };\n  });\n  const recorded = new Set(data.events.map(e => e.studentId).filter(Boolean));\n  return <AppShell universe="teacher" title="My attendance" subtitle="Take attendance only for learners in your assigned teaching groups." active="My Attendance" schoolName={data.school?.name ?? "School Workspace"} schoolCode={data.school?.uniqueCode ?? ""} userName={session.name} role="Teacher"><div className="module-workspace"><section className="module-setup-card module-card"><div><span className="module-overline">Teacher register</span><h3>Your attendance scope</h3><p>Only learners in your class-teacher or subject-teacher assignments appear here.</p></div><div className="module-setup-list"><Link href="/teacher">↩ Teacher home</Link><Link href="/teacher/module?view=My%20Gradebook">Open my gradebook</Link><Link href="/teacher/module?view=My%20Homework">Open my homework</Link></div></section><section className="module-metrics"><article><span>Assigned classes</span><strong>{data.classes.length}</strong><small>Classes in your scope</small></article><article><span>Students in scope</span><strong>{data.students.length}</strong><small>Eligible learners</small></article><article><span>Recorded</span><strong>{recorded.size}</strong><small>Decisions on {date}</small></article><article><span>Remaining</span><strong>{Math.max(0,data.students.length-recorded.size)}</strong><small>Still need a decision</small></article></section><section className="module-card"><div className="module-section-title"><div><span>Record attendance · {date}</span><h3>Teacher register</h3><p>The server enforces your teaching scope and duplicate protection.</p></div></div><form action={saveAttendance} style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:10,marginTop:15}}><input type="date" name="attendanceDate" defaultValue={date} required /><select name="studentId" required defaultValue=""><option value="">Choose learner</option>{data.students.map(s => <option key={s.id} value={s.id}>{s.name} · {s.class?.name ?? "Unassigned"}</option>)}</select><select name="type" defaultValue="in"><option value="in">Present</option><option value="out">Absent</option></select><button className="module-hero-button" type="submit">Save attendance →</button></form></section><section className="module-card"><div className="module-section-title"><div><span>Recorded activity</span><h3>Your register</h3></div></div><div className="module-workflow">{data.events.map(e => <div className="module-workflow-step" key={e.id}><span>{e.type.slice(0,1).toUpperCase()}</span><div><strong>{e.student?.name ?? "Unknown"}</strong><small>{e.student?.admissionNo ?? ""} · {e.student?.class?.name ?? ""} · {e.type}</small></div></div>)}{!data.events.length ? <div className="module-empty"><strong>No attendance recorded yet.</strong><p>Choose a learner above to begin.</p></div> : null}</div></section></div></AppShell>;\n}\n''')

          # Navigation cleanup.
          p='src/components/AppShell.tsx'; s=read(p)
          if '["◉", "My Attendance", "/teacher/attendance"]' not in s: add_once(p,'["◉", "My Attendance", teacherModule("My Attendance")]','["◉", "My Attendance", "/teacher/attendance"]')
          if '{ label: "School Life"' in s:
              import re; s=read(p); s,n=re.subn(r'  \{ label: "School Life", items: \[\["▦", "Library".*?\n','',s,count=1,flags=re.S); assert n==1; write(p,s)

          # Public module cards no longer enter protected application pages.
          p='src/app/page.tsx'; s=read(p)
          repls=[
            ('/school/students','/features'),('/school/subjects','/features'),('/school/attendance','/features'),('/school/fees','/features'),('/school/communications/announcements','/features'),('/school/staff','/features')]
          for old,new in repls: s=s.replace(old,new)
          write(p,s)

          # Honest readiness on Command Center.
          p='src/app/dashboard/page.tsx'; s=read(p)
          if 'activatedNonOwnerStaff' not in s:
              marker='        pendingStaff,\n      ] = await Promise.all(['; assert s.count(marker)==1; s=s.replace(marker,'        pendingStaff,\n        activatedNonOwnerStaff,\n        hasBranding,\n      ] = await Promise.all([',1)
              marker='''        tx.user.count({\n          where: {\n            status: "pending",\n            userRoles: { some: { role: { key: { notIn: ["guardian", "parent", "student"] } } } },\n          },\n        }),\n      ]);'''; assert s.count(marker)==1; s=s.replace(marker,'''        tx.user.count({\n          where: {\n            status: "pending",\n            userRoles: { some: { role: { key: { notIn: ["guardian", "parent", "student"] } } } },\n          },\n        }),\n        tx.user.count({\n          where: { status: "active", NOT: { userRoles: { some: { role: { key: "owner" } } } }, userRoles: { some: { role: { key: { notIn: ["guardian", "parent", "student"] } } } } },\n        }),\n        tx.school.findUnique({ where: { id: schoolSession.schoolId }, select: { logoUrl: true, brandColors: true } }).then(s => Boolean(s?.logoUrl || s?.brandColors)),\n      ]);''',1)
              s=s.replace('''        pendingStaff,\n      };''','''        pendingStaff,\n        activatedNonOwnerStaff,\n        hasBranding,\n      };''',1)
              s=s.replace('pendingStaff: number; pendingReportCards: number; pendingFeeAdjustments: number;','pendingStaff: number; pendingReportCards: number; pendingFeeAdjustments: number; activatedNonOwnerStaff: number; hasBranding: boolean;',1)
              s=s.replace('["School profile & branding", true, "/school/settings"],','["School profile & branding", Boolean(stats.hasBranding), "/school/settings"],',1)
              s=s.replace('["Staff accounts", stats.staff > 0 && stats.pendingStaff === 0, "/school/staff"],','["Staff accounts", stats.activatedNonOwnerStaff > 0 && stats.pendingStaff === 0, "/school/settings/access"],',1)
              s=s.replace('["Classes & subjects", stats.classes > 0 && stats.subjects > 0, "/school/classes"],','["Classes & subjects", stats.classes > 0 && stats.subjects > 0, "/school/classes"],\n    ["Students", stats.students > 0, "/school/students"],',1)
              write(p,s)

          Path('prisma/migrations/20260831050000_operational_lifecycle').mkdir(parents=True,exist_ok=True)
          mp=Path('prisma/migrations/20260831050000_operational_lifecycle/migration.sql')
          if not mp.exists(): mp.write_text('ALTER TABLE "User" ADD COLUMN "needsPasswordChange" BOOLEAN NOT NULL DEFAULT false;\n')
          print('repair prepared')
          PY
          git diff --check
      - name: Commit product and remove repair workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/sukuunova-ops-repair.yml
          git add prisma/schema.prisma prisma/migrations/20260831050000_operational_lifecycle/migration.sql src/lib/login-service.ts src/lib/onboarding-service.ts src/app/account/security/page.tsx src/app/teacher/attendance/page.tsx src/components/AppShell.tsx src/app/page.tsx src/app/dashboard/page.tsx .github/workflows/sukuunova-ops-repair.yml
          git commit -m 'fix: make teacher and onboarding workflows operational'
          git push
