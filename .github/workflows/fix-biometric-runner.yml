name: Fix biometric implementation runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-biometric-runner.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runner
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/implement-biometric-devices.yml')
          s = p.read_text()
          if 'export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres' not in s:
              s = s.replace('          npm ci\n', '          npm ci\n          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres\n', 1)
          s = s.replace('"devices:manage"', '"settings:manage_school"')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/implement-biometric-devices.yml
          git commit -m "fix: validate biometric schema with pinned runner config"
          git push origin main
