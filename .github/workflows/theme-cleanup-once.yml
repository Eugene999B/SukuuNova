name: One-time theme cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/theme-cleanup-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize legacy visual aliases
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/visual-system.css')
          s = p.read_text()
          old = ':root{--nova-canvas:#f4f8fb;--nova-surface:#ffffff;--nova-surface-2:#f8fbfd;--nova-ink:#102434;--nova-ink-2:#2b4354;--nova-muted:#6d8290;--nova-line:#dbe6ec;--nova-mint:#1cc7a0;--nova-blue:#4169ff;--nova-soft-mint:#e8fbf5;--nova-soft-blue:#edf1ff;--nova-shadow:0 18px 50px rgba(19,42,58,.08)}'
          new = ':root{--nova-canvas:var(--sn-canvas);--nova-surface:var(--sn-surface);--nova-surface-2:var(--sn-surface-2);--nova-ink:var(--sn-ink);--nova-ink-2:var(--sn-ink-2);--nova-muted:var(--sn-muted);--nova-line:var(--sn-line);--nova-mint:var(--sn-accent);--nova-blue:var(--sn-platform-accent);--nova-soft-mint:var(--sn-guardian-tint);--nova-soft-blue:var(--sn-platform-tint);--nova-shadow:var(--sn-shadow-md)}'
          if old not in s:
              raise SystemExit('legacy nova token block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/visual-system.css
          git commit -m 'refactor(theme): alias legacy visual tokens to canonical system'
          git push