name: Apply hardware attendance implementation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hardware-attendance.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: npm ci
      - name: Patch and validate
        run: |
          set -euo pipefail
          cat > /tmp/patch.py <<'PY'
from pathlib import Path
root = Path('.')
def read(p): return (root/p).read_text()
def write(p,s): (root/p).write_text(s)
def repl(p, old, new):
    s=read(p); n=s.count(old)
    if n != 1: raise SystemExit(f'{p}: expected 1 match, got {n}')
    write(p,s.replace(old,new,1))

schema='prisma/schema.prisma'
s=read(schema)
if 'model Device {' not in s:
    repl(schema,'  houses              House[]\n}', '  houses              House[]\n  devices             Device[]\n  deviceIdentities    DeviceIdentity[]\n  deviceAttendanceReceipts DeviceAttendanceReceipt[]\n}')
    repl(schema,'  faceReviewsCompleted FaceMatchReview[] @relation("FaceReviewedBy")\n', '  faceReviewsCompleted FaceMatchReview[] @relation("FaceReviewedBy")\n  deviceIdentities DeviceIdentity[] @relation("DeviceIdentityStaff")\n')
    repl(schema,'  faceMatchReviews FaceMatchReview[]\n', '  faceMatchReviews FaceMatchReview[]\n  deviceIdentities DeviceIdentity[] @relation("DeviceIdentityStudent")\n')
    repl(schema,'  recordedBy       String\n', '  recordedBy       String?\n')
    repl(schema,'  recorder         User     @relation("AttendanceRecorder", fields: [recordedBy, schoolId], references: [id, schoolId], onDelete: Restrict)\n', '  recorder         User?    @relation("AttendanceRecorder", fields: [recordedBy, schoolId], references: [id, schoolId], onDelete: Restrict)\n  device           Device?  @relation(fields: [deviceId, schoolId], references: [id, schoolId], onDelete: Restrict)\n')
    s=read(schema)
    s += r'''

model Device {
  id                 String   @id @default(cuid())
  schoolId           String
  deviceSerial       String
  kind               String
  label              String
  apiKeyHash         String
  status              String   @default("active")
  lastSeenAt         DateTime?
  createdAt          DateTime @default(now())
  school             School   @relation(fields: [schoolId], references: [id], onDelete: Restrict)
  attendanceEvents   AttendanceEvent[]
  identities         DeviceIdentity[]
  attendanceReceipts DeviceAttendanceReceipt[]
  @@unique([id, schoolId])
  @@unique([schoolId, deviceSerial])
  @@index([schoolId])
}

model DeviceIdentity {
  id         String   @id @default(cuid())
  schoolId   String
  deviceKind String
  externalId String
  studentId  String?
  staffId    String?
  createdAt  DateTime @default(now())
  school     School   @relation(fields: [schoolId], references: [id], onDelete: Restrict)
  student    Student? @relation("DeviceIdentityStudent", fields: [studentId, schoolId], references: [id, schoolId], onDelete: Restrict)
  staff      User?    @relation("DeviceIdentityStaff", fields: [staffId, schoolId], references: [id, schoolId], onDelete: Restrict)
  @@unique([id, schoolId])
  @@unique([schoolId, deviceKind, externalId])
  @@unique([schoolId, deviceKind, studentId])
  @@unique([schoolId, deviceKind, staffId])
  @@index([schoolId])
}

model DeviceAttendanceReceipt {
  id             String   @id @default(cuid())
  schoolId       String
  deviceId       String
  idempotencyKey String
  nonce          String
  capturedAt     DateTime?
  createdAt      DateTime @default(now())
  processedAt    DateTime?
  school         School   @relation(fields: [schoolId], references: [id], onDelete: Restrict)
  device         Device   @relation(fields: [deviceId, schoolId], references: [id, schoolId], onDelete: Cascade)
  @@unique([id, schoolId])
  @@unique([schoolId, deviceId, idempotencyKey])
  @@unique([schoolId, deviceId, nonce])
  @@index([schoolId])
  @@index([schoolId, deviceId, createdAt])
}
'''
    write(schema,s)
PY
          python /tmp/patch.py
          mkdir -p prisma/migrations/20260831081000_biometric_devices
          cat > prisma/migrations/20260831081000_biometric_devices/migration.sql <<'SQL'
ALTER TABLE "AttendanceEvent" ALTER COLUMN "recordedBy" DROP NOT NULL;
ALTER TABLE "Device" ENABLE ROW LEVEL SECURITY;
ALTER TABLE "Device" FORCE ROW LEVEL SECURITY;
CREATE POLICY "Device_tenant_isolation" ON "Device" USING ("schoolId" = sukuunova_current_school_id()) WITH CHECK ("schoolId" = sukuunova_current_school_id());
ALTER TABLE "DeviceIdentity" ENABLE ROW LEVEL SECURITY;
ALTER TABLE "DeviceIdentity" FORCE ROW LEVEL SECURITY;
CREATE POLICY "DeviceIdentity_tenant_isolation" ON "DeviceIdentity" USING ("schoolId" = sukuunova_current_school_id()) WITH CHECK ("schoolId" = sukuunova_current_school_id());
ALTER TABLE "DeviceAttendanceReceipt" ENABLE ROW LEVEL SECURITY;
ALTER TABLE "DeviceAttendanceReceipt" FORCE ROW LEVEL SECURITY;
CREATE POLICY "DeviceAttendanceReceipt_tenant_isolation" ON "DeviceAttendanceReceipt" USING ("schoolId" = sukuunova_current_school_id()) WITH CHECK ("schoolId" = sukuunova_current_school_id());
SQL
          ./node_modules/.bin/prisma format
          ./node_modules/.bin/prisma validate
          ./node_modules/.bin/prisma generate
          git diff --check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma prisma/migrations/20260831081000_biometric_devices/migration.sql
          git add src/lib/db.ts src/lib/message-outbox.ts src/lib/attendance-service.ts src/lib/face-service.ts src/app/api/phase2/face/route.ts
          git commit -m "feat: integrate biometric attendance" || exit 0
          git push origin main
