name: One-time biometric cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-biometric-duplicate.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicated guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/api/devices/attendance/route.ts')
          s = p.read_text()
          old = '      if (recorded.status !== "recorded") return recorded;\n\n      if (recorded.status !== "recorded") return recorded;'
          new = '      if (recorded.status !== "recorded") return recorded;'
          if old not in s:
              raise SystemExit('duplicate guard not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/api/devices/attendance/route.ts
          git commit -m 'fix: remove duplicate biometric attendance guard'
          git push
