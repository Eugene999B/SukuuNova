name: repair-access-preselect
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Access preselection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/school/settings/access/page.tsx')
          s=p.read_text()
          original=s
          if 'useSearchParams' not in s:
              s=s.replace('import { useEffect, useMemo, useState } from "react";', 'import { useEffect, useMemo, useState } from "react";\nimport { useSearchParams } from "next/navigation";')
          if 'const searchParams = useSearchParams();' not in s:
              s=s.replace('export default function AccessPage() {\n', 'export default function AccessPage() {\n  const searchParams = useSearchParams();\n')
          marker='  useEffect(() => {\n    void load();\n  }, []);\n'
          replacement='  useEffect(() => {\n    void load();\n  }, []);\n\n  useEffect(() => {\n    const requestedUserId = searchParams.get("userId");\n    if (!data || !requestedUserId) return;\n    const requestedUser = data.users.find((user) => user.id === requestedUserId);\n    if (requestedUser && requestedUser.id !== selectedId) openUser(requestedUser);\n  }, [data, searchParams, selectedId]);\n'
          if 'const requestedUserId = searchParams.get("userId")' not in s:
              if marker not in s:
                  raise SystemExit('Access load effect marker not found')
              s=s.replace(marker,replacement,1)
          if s==original:
              raise SystemExit('Access preselection already present but no writable change')
          p.write_text(s)
          PY
      - name: Commit and remove repair workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/school/settings/access/page.tsx .github/workflows/repair-access-preselect.yml
          git rm .github/workflows/repair-access-preselect.yml
          git commit -m 'fix(access): preselect user from activation link'
          git push
