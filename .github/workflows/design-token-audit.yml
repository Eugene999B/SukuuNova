name: Design token audit

on:
  push:
    branches: [fix/application-design-system]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit hardcoded colors
        run: node scripts/design-token-audit.mjs --fail
