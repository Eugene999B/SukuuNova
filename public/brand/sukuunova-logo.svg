    <path d="M116 141C120 122 127 105 139 91C151 77 164 68 181 60" stroke="#F4FBFF" stroke-width="6" stroke-linecap="round"/>
    <path d="M181 60L178 48L190 53L201 41L202 55L214 59L202 65L204 78L193 70L182 79L184 66L173 60L181 60Z" fill="#62F6E7"/>
    <circle cx="60" cy="62" r="4" fill="#62F6E7"/>
    <circle cx="188" cy="37" r="3" fill="#6E6AF6"/>
